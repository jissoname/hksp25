<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#1a73e8"
>

<title>
    社團評選－評審系統
</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    min-height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Roboto,
        sans-serif;

    background:
        #f5f7fb;

    color:
        #202124;

}


button,
input {

    font: inherit;

}


button {

    cursor: pointer;

}


:root {

    --primary:
        #1a73e8;

    --primary-dark:
        #1557b0;

    --border:
        #e4e7ec;

    --muted:
        #667085;

    --success:
        #167542;

    --success-bg:
        #e7f6ec;

    --warning:
        #b54708;

    --warning-bg:
        #fff6e8;

    --danger:
        #d92d20;

    --danger-bg:
        #fff1f0;

    --gray-bg:
        #f2f4f7;

    --shadow:
        0 8px 28px
        rgba(
            16,
            24,
            40,
            .07
        );

}


.hidden {

    display: none !important;

}


/* ============================================================
   登入
   ============================================================ */

.login-screen {

    min-height:
        100vh;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        24px;

}


.login-card {

    width:
        min(
            430px,
            100%
        );

    background:
        #fff;

    border:
        1px solid
        var(--border);

    border-radius:
        22px;

    padding:
        32px;

    box-shadow:
        0 20px 60px
        rgba(
            16,
            24,
            40,
            .12
        );

}


.login-icon {

    font-size:
        38px;

}


.login-title {

    font-size:
        26px;

    font-weight:
        900;

    margin:
        12px 0 5px;

}


.login-subtitle {

    color:
        var(--muted);

    font-size:
        13px;

    line-height:
        1.7;

}


.label {

    display:
        block;

    font-size:
        12px;

    font-weight:
        800;

    margin:
        15px 0 6px;

}


.input {

    width:
        100%;

    height:
        44px;

    border:
        1px solid
        #d0d5dd;

    border-radius:
        10px;

    padding:
        0 12px;

    outline:
        none;

    background:
        #fff;

}


.input:focus {

    border-color:
        var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(
            26,
            115,
            232,
            .08
        );

}


.login-btn {

    width:
        100%;

    margin-top:
        20px;

    min-height:
        46px;

    border:
        0;

    border-radius:
        10px;

    background:
        var(--primary);

    color:
        #fff;

    font-weight:
        900;

}


.login-btn:hover {

    background:
        var(--primary-dark);

}


.login-btn:disabled {

    opacity:
        .6;

    cursor:
        not-allowed;

}


.error-text {

    color:
        var(--danger);

    font-size:
        12px;

    line-height:
        1.6;

    margin-top:
        10px;

}


/* ============================================================
   主系統
   ============================================================ */

.app {

    display:
        none;

}


.topbar {

    position:
        sticky;

    top:
        0;

    z-index:
        50;

    background:
        rgba(
            255,
            255,
            255,
            .96
        );

    backdrop-filter:
        blur(
            10px
        );

    border-bottom:
        1px solid
        var(--border);

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        12px;

    padding:
        12px
        max(
            16px,
            calc(
                (
                    100vw
                    -
                    1100px
                )
                /
                2
            )
        );

}


.brand {

    font-weight:
        900;

    font-size:
        16px;

}


.brand-subtitle {

    font-size:
        11px;

    color:
        var(--muted);

    margin-top:
        2px;

}


.top-actions {

    display:
        flex;

    gap:
        8px;

}


.btn {

    min-height:
        38px;

    border:
        1px solid
        var(--border);

    border-radius:
        9px;

    background:
        #fff;

    padding:
        0 12px;

    font-weight:
        800;

    color:
        #344054;

}


.btn:hover {

    background:
        #f9fafb;

}


.btn-primary {

    background:
        var(--primary);

    border-color:
        var(--primary);

    color:
        #fff;

}


.btn-primary:hover {

    background:
        var(--primary-dark);

}


.btn-success {

    background:
        var(--success-bg);

    border-color:
        #cce7d5;

    color:
        var(--success);

}


.btn-danger {

    background:
        var(--danger-bg);

    border-color:
        #f5c7c4;

    color:
        var(--danger);

}


.btn:disabled {

    opacity:
        .55;

    cursor:
        not-allowed;

}


.main {

    width:
        min(
            1100px,
            calc(
                100%
                -
                28px
            )
        );

    margin:
        auto;

    padding:
        22px 0 60px;

}


/* ============================================================
   評審資料
   ============================================================ */

.welcome-card {

    background:
        linear-gradient(
            135deg,
            #1a73e8,
            #3f8df5
        );

    color:
        #fff;

    border-radius:
        18px;

    padding:
        19px;

    box-shadow:
        var(--shadow);

    margin-bottom:
        14px;

}


.welcome-title {

    font-size:
        22px;

    font-weight:
        900;

}


.welcome-sub {

    margin-top:
        5px;

    font-size:
        12px;

    opacity:
        .9;

}


.category-chips {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        6px;

    margin-top:
        12px;

}


.category-chip {

    display:
        inline-flex;

    background:
        rgba(
            255,
            255,
            255,
            .18
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .3
        );

    border-radius:
        999px;

    padding:
        6px 10px;

    font-size:
        11px;

    font-weight:
        850;

}


/* ============================================================
   統計
   ============================================================ */

.stats {

    display:
        grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap:
        9px;

    margin-bottom:
        14px;

}


.stat {

    background:
        #fff;

    border:
        1px solid
        var(--border);

    border-radius:
        14px;

    padding:
        14px;

    box-shadow:
        var(--shadow);

}


.stat-label {

    font-size:
        11px;

    color:
        var(--muted);

    font-weight:
        800;

}


.stat-value {

    font-size:
        22px;

    font-weight:
        900;

    margin-top:
        4px;

}


/* ============================================================
   階段 Tabs
   ============================================================ */

.stage-tabs {

    display:
        flex;

    gap:
        8px;

    overflow-x:
        auto;

    padding-bottom:
        6px;

    margin-bottom:
        12px;

}


.stage-tab {

    flex:
        0 0 auto;

    min-height:
        42px;

    border:
        1px solid
        var(--border);

    border-radius:
        11px;

    background:
        #fff;

    padding:
        0 14px;

    font-weight:
        900;

    color:
        #475467;

}


.stage-tab.active {

    background:
        #eef4ff;

    border-color:
        #a9c8ff;

    color:
        #1557b0;

}


/* ============================================================
   Toolbar
   ============================================================ */

.toolbar {

    display:
        flex;

    gap:
        8px;

    align-items:
        center;

    flex-wrap:
        wrap;

    margin-bottom:
        12px;

}


.search {

    flex:
        1;

    min-width:
        180px;

    height:
        40px;

    border:
        1px solid
        #d0d5dd;

    border-radius:
        9px;

    padding:
        0 11px;

    outline:
        none;

}


.search:focus {

    border-color:
        var(--primary);

}


.filter-btn {

    min-height:
        40px;

    border:
        1px solid
        var(--border);

    border-radius:
        9px;

    background:
        #fff;

    padding:
        0 11px;

    font-size:
        12px;

    font-weight:
        800;

}


.filter-btn.active {

    background:
        #eef4ff;

    border-color:
        #b8d1ff;

    color:
        #1557b0;

}


/* ============================================================
   屬性標題
   ============================================================ */

.category-block {

    margin-bottom:
        18px;

}


.category-title {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;

    font-size:
        15px;

    font-weight:
        900;

    padding:
        5px 2px 9px;

}


.category-count {

    color:
        var(--muted);

    font-size:
        11px;

}


/* ============================================================
   社團卡
   ============================================================ */

.club-list {

    display:
        grid;

    gap:
        8px;

}


.club-card {

    background:
        #fff;

    border:
        1px solid
        var(--border);

    border-radius:
        13px;

    padding:
        13px;

    display:
        grid;

    grid-template-columns:
        minmax(
            0,
            1fr
        )
        auto;

    gap:
        10px;

    align-items:
        center;

    box-shadow:
        0 2px 9px
        rgba(
            16,
            24,
            40,
            .035
        );

}


.club-name {

    font-size:
        14px;

    font-weight:
        900;

}


.club-meta {

    margin-top:
        4px;

    color:
        var(--muted);

    font-size:
        11px;

    line-height:
        1.6;

}


.status {

    display:
        inline-flex;

    align-items:
        center;

    border-radius:
        999px;

    padding:
        5px 8px;

    font-size:
        10px;

    font-weight:
        900;

}


.status-none {

    background:
        var(--gray-bg);

    color:
        #667085;

}


.status-draft {

    background:
        var(--warning-bg);

    color:
        var(--warning);

}


.status-submitted {

    background:
        var(--success-bg);

    color:
        var(--success);

}


/* ============================================================
   空狀態
   ============================================================ */

.state {

    background:
        #fff;

    border:
        1px solid
        var(--border);

    border-radius:
        13px;

    padding:
        32px 16px;

    text-align:
        center;

    color:
        var(--muted);

    font-size:
        12px;

}


.spinner {

    width:
        27px;

    height:
        27px;

    margin:
        0 auto 9px;

    border:
        3px solid
        #e8eef7;

    border-top-color:
        var(--primary);

    border-radius:
        50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin {

    to {

        transform:
            rotate(
                360deg
            );

    }

}


/* ============================================================
   Modal
   ============================================================ */

.modal-bg {

    position:
        fixed;

    inset:
        0;

    z-index:
        1000;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        14px;

    background:
        rgba(
            16,
            24,
            40,
            .62
        );

}


.modal {

    width:
        min(
            720px,
            100%
        );

    max-height:
        94vh;

    overflow:
        auto;

    background:
        #fff;

    border-radius:
        18px;

    box-shadow:
        0 30px 80px
        rgba(
            16,
            24,
            40,
            .3
        );

}


.modal-head {

    position:
        sticky;

    top:
        0;

    z-index:
        2;

    background:
        #fff;

    border-bottom:
        1px solid
        var(--border);

    padding:
        16px 18px;

    display:
        flex;

    justify-content:
        space-between;

    gap:
        12px;

    align-items:
        flex-start;

}


.modal-title {

    font-size:
        18px;

    font-weight:
        900;

}


.modal-sub {

    font-size:
        11px;

    color:
        var(--muted);

    margin-top:
        4px;

}


.close-btn {

    width:
        36px;

    height:
        36px;

    border:
        1px solid
        var(--border);

    background:
        #fff;

    border-radius:
        9px;

}


.modal-body {

    padding:
        16px;

}


/* ============================================================
   分類評分
   ============================================================ */

.score-summary {

    display:
        grid;

    grid-template-columns:
        1fr auto;

    gap:
        12px;

    align-items:
        center;

    padding:
        13px;

    border:
        1px solid
        #bfd7ff;

    background:
        #f5f9ff;

    border-radius:
        12px;

    margin-bottom:
        12px;

}


.summary-label {

    color:
        #475467;

    font-size:
        11px;

    font-weight:
        800;

}


.summary-score {

    font-size:
        26px;

    font-weight:
        900;

    color:
        #174b88;

}


.score-group {

    border:
        1px solid
        var(--border);

    border-radius:
        13px;

    margin-bottom:
        12px;

    overflow:
        hidden;

}


.group-head {

    padding:
        11px 13px;

    background:
        #f9fafb;

    border-bottom:
        1px solid
        var(--border);

    display:
        flex;

    justify-content:
        space-between;

    gap:
        12px;

    align-items:
        center;

}


.group-name {

    font-size:
        13px;

    font-weight:
        900;

}


.group-score {

    font-size:
        12px;

    font-weight:
        900;

}


.criteria-list {

    padding:
        4px 12px;

}


.criterion {

    display:
        grid;

    grid-template-columns:
        minmax(
            0,
            1fr
        )
        135px;

    align-items:
        center;

    gap:
        12px;

    padding:
        12px 0;

    border-bottom:
        1px dashed
        #e4e7ec;

}


.criterion:last-child {

    border-bottom:
        0;

}


.criterion-name {

    font-size:
        13px;

    font-weight:
        850;

}


.criterion-max {

    font-size:
        10px;

    color:
        var(--muted);

    margin-top:
        3px;

}


.score-input-wrap {

    display:
        flex;

    align-items:
        center;

    gap:
        6px;

}


.score-input {

    width:
        90px;

    height:
        42px;

    border:
        1px solid
        #d0d5dd;

    border-radius:
        9px;

    padding:
        0 9px;

    text-align:
        right;

    font-weight:
        900;

    outline:
        none;

}


.score-input:focus {

    border-color:
        var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(
            26,
            115,
            232,
            .08
        );

}


.score-input.invalid {

    border-color:
        var(--danger);

    background:
        var(--danger-bg);

}


.score-input:disabled {

    background:
        #f2f4f7;

    color:
        #475467;

}


.out-of {

    font-size:
        11px;

    color:
        var(--muted);

    min-width:
        35px;

}


.score-warning {

    display:
        none;

    margin-top:
        10px;

    padding:
        10px 11px;

    border:
        1px solid
        #f5c7c4;

    background:
        var(--danger-bg);

    color:
        #7a271a;

    border-radius:
        9px;

    font-size:
        11px;

    line-height:
        1.6;

}


.score-warning.show {

    display:
        block;

}


/* ============================================================
   Modal Footer
   ============================================================ */

.modal-footer {

    position:
        sticky;

    bottom:
        0;

    background:
        #fff;

    border-top:
        1px solid
        var(--border);

    padding:
        13px 16px;

    display:
        flex;

    justify-content:
        space-between;

    gap:
        9px;

    align-items:
        center;

}


.save-info {

    font-size:
        10px;

    color:
        var(--muted);

}


.footer-actions {

    display:
        flex;

    gap:
        8px;

}


/* ============================================================
   已鎖定
   ============================================================ */

.locked-box {

    padding:
        11px;

    border:
        1px solid
        #cce7d5;

    background:
        var(--success-bg);

    color:
        var(--success);

    border-radius:
        10px;

    font-size:
        12px;

    font-weight:
        800;

    margin-bottom:
        12px;

}


/* ============================================================
   Toast
   ============================================================ */

.toast {

    position:
        fixed;

    right:
        18px;

    bottom:
        18px;

    z-index:
        2000;

    padding:
        11px 15px;

    background:
        #101828;

    color:
        #fff;

    border-radius:
        9px;

    opacity:
        0;

    transform:
        translateY(
            10px
        );

    transition:
        .2s;

    pointer-events:
        none;

    max-width:
        390px;

    font-size:
        12px;

    line-height:
        1.5;

}


.toast.show {

    opacity:
        1;

    transform:
        none;

}


/* ============================================================
   RWD
   ============================================================ */

@media (
    max-width: 700px
) {

    .stats {

        grid-template-columns:
            1fr 1fr;

    }


    .topbar {

        align-items:
            flex-start;

    }


    .brand-subtitle {

        display:
            none;

    }


    .top-actions .refresh-text {

        display:
            none;

    }


    .club-card {

        grid-template-columns:
            1fr;

    }


    .club-card .btn {

        width:
            100%;

    }


    .criterion {

        grid-template-columns:
            minmax(
                0,
                1fr
            )
            125px;

    }


    .score-input {

        width:
            82px;

    }


    .modal-bg {

        padding:
            0;

        align-items:
            flex-end;

    }


    .modal {

        width:
            100%;

        max-height:
            96vh;

        border-radius:
            18px 18px 0 0;

    }


    .modal-footer {

        flex-direction:
            column;

        align-items:
            stretch;

    }


    .footer-actions {

        display:
            grid;

        grid-template-columns:
            1fr 1fr;

    }


    .footer-actions .btn {

        width:
            100%;

    }

}

</style>

</head>


<body>


<!-- ============================================================
     登入
     ============================================================ -->

<section
    id="loginScreen"
    class="login-screen"
>

<div class="login-card">

    <div class="login-icon">
        👨‍⚖️
    </div>


    <h1 class="login-title">
        評審登入
    </h1>


    <div class="login-subtitle">
        115學年度第一學期
        <br>
        全校學生社團評選暨觀摩活動
    </div>


    <form
        id="loginForm"
    >

        <label
            class="label"
            for="judgeUsername"
        >
            評審帳號
        </label>


        <input
            id="judgeUsername"
            class="input"
            type="text"
            autocomplete="username"
            required
            placeholder="請輸入帳號"
        >


        <label
            class="label"
            for="judgePassword"
        >
            密碼
        </label>


        <input
            id="judgePassword"
            class="input"
            type="password"
            autocomplete="current-password"
            required
            placeholder="請輸入密碼"
        >


        <button
            id="loginBtn"
            class="login-btn"
            type="submit"
        >
            登入評審系統
        </button>


        <div
            id="loginError"
            class="error-text"
        ></div>

    </form>

</div>
</section>


<!-- ============================================================
     主系統
     ============================================================ -->

<div
    id="judgeApp"
    class="app"
>


<header class="topbar">

    <div>

        <div class="brand">
            👨‍⚖️ 社團評選評審系統
        </div>

        <div class="brand-subtitle">
            弘光科技大學
        </div>

    </div>


    <div class="top-actions">

        <button
            class="btn"
            onclick="loadDashboard()"
        >
            🔄
            <span class="refresh-text">
                重新整理
            </span>
        </button>


        <button
            class="btn btn-danger"
            onclick="logoutJudge()"
        >
            登出
        </button>

    </div>

</header>


<main class="main">


<!-- 評審資料 -->

<section
    id="welcomeCard"
    class="welcome-card"
>

    <div
        id="judgeDisplayName"
        class="welcome-title"
    >
        評審
    </div>


    <div class="welcome-sub">

<script>


/* ============================================================
   系統設定
   ============================================================ */

const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbygg-cv817Dk8338KdcjChkMwAPjf-_sAnghtgIPfNn9GGEHveHEpjYQ7YV0gxtZct-/exec";


const SESSION_KEY =
    "HKSP_JUDGE_SESSION";


const STATE = {

    sessionToken:
        null,

    judge:
        null,

    dashboard:
        null,

    stages:
        [],

    currentStageKey:
        null,

    statusFilter:
        "all",

    currentClub:
        null,

    currentStage:
        null,

    currentRecord:
        null,

    locked:
        false,

    requestRunning:
        false

};


/* ============================================================
   DOM
   ============================================================ */

const $ =
    id =>
        document.getElementById(
            id
        );


/* ============================================================
   Escape
   ============================================================ */

function escapeHtml(
    value
) {

    return String(
        value ??
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* ============================================================
   數字
   ============================================================ */

function numberValue(
    value
) {

    const number =
        Number(
            value
        );


    return Number.isFinite(
        number
    )
        ? Math.round(
            number *
            10000
          ) /
          10000

        : 0;

}


function formatScore(
    value
) {

    return String(
        numberValue(
            value
        )
    );

}


/* ============================================================
   Toast
   ============================================================ */

function showToast(
    message
) {

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        showToast.timer
    );


    showToast.timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2600
        );

}


/* ============================================================
   Backend
   ============================================================ */

async function postBackend(
    payload
) {

    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            () => {

                controller.abort();

            },
            15000
        );


    try {

        const response =
            await fetch(

                BACKEND_URL,

                {

                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            payload
                        ),

                    redirect:
                        "follow",

                    signal:
                        controller.signal

                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        try {

            return JSON.parse(
                text
            );

        }

        catch (error) {

            console.error(
                "後端原始回應：",
                text
            );


            throw new Error(
                "後端回傳格式錯誤"
            );

        }

    }

    catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            throw new Error(
                "後端連線逾時"
            );

        }


        throw error;

    }

    finally {

        clearTimeout(
            timeout
        );

    }

}


/* ============================================================
   Judge API
   ============================================================ */

async function judgeApi(
    action,
    extra = {}
) {

    return postBackend({

        action:
            action,

        sessionToken:
            STATE.sessionToken,

        ...extra

    });

}


/* ============================================================
   Session
   ============================================================ */

function saveSession(
    token
) {

    STATE.sessionToken =
        token;


    sessionStorage.setItem(
        SESSION_KEY,
        token
    );

}


function clearSession() {

    STATE.sessionToken =
        null;


    STATE.judge =
        null;


    STATE.dashboard =
        null;


    sessionStorage.removeItem(
        SESSION_KEY
    );

}


function isUnauthorized(
    result
) {

    if (
        !result
    ) {

        return false;

    }


    const unauthorizedCodes = [

        "JUDGE_UNAUTHORIZED",

        "JUDGE_SESSION_INVALID",

        "JUDGE_SESSION_EXPIRED",

        "JUDGE_NOT_LOGGED_IN"

    ];


    if (
        unauthorizedCodes.includes(
            result.error
        )
    ) {

        clearSession();

        showLogin();


        $("loginError")
            .textContent =
            "評審登入已失效，請重新登入。";


        return true;

    }


    return false;

}


/* ============================================================
   登入畫面
   ============================================================ */

function showLogin() {

    $("loginScreen")
        .style
        .display =
        "flex";


    $("judgeApp")
        .style
        .display =
        "none";

}


function showApp() {

    $("loginScreen")
        .style
        .display =
        "none";


    $("judgeApp")
        .style
        .display =
        "block";

}


/* ============================================================
   登入
   ============================================================ */

$("loginForm")
    .addEventListener(

        "submit",

        async event => {

            event.preventDefault();


            if (
                STATE.requestRunning
            ) {

                return;

            }


            const username =
                $("judgeUsername")
                    .value
                    .trim();


            const password =
                $("judgePassword")
                    .value;


            const button =
                $("loginBtn");


            if (
                !username
                ||
                !password
            ) {

                $("loginError")
                    .textContent =
                    "請輸入帳號與密碼。";


                return;

            }


            try {

                STATE.requestRunning =
                    true;


                button.disabled =
                    true;


                button.textContent =
                    "登入中...";


                $("loginError")
                    .textContent =
                    "";


                const result =
                    await postBackend({

                        action:
                            "judgeLogin",

                        username:
                            username,

                        password:
                            password

                    });


                if (
                    !result.success
                ) {

                    throw new Error(

                        result.message
                        ||
                        "登入失敗"

                    );

                }


                const token =

                    result.sessionToken

                    ||

                    (
                        result.session &&
                        result.session.token
                    )

                    ||

                    result.token;


                if (
                    !token
                ) {

                    throw new Error(
                        "後端沒有回傳評審登入憑證。"
                    );

                }


                saveSession(
                    token
                );


                $("judgePassword")
                    .value =
                    "";


                showApp();


                await loadDashboard();


                showToast(
                    "✅ 評審登入成功"
                );

            }

            catch (error) {

                clearSession();


                showLogin();


                $("loginError")
                    .textContent =
                    error.message;

            }

            finally {

                STATE.requestRunning =
                    false;


                button.disabled =
                    false;


                button.textContent =
                    "登入評審系統";

            }

        }

    );


/* ============================================================
   登出
   ============================================================ */

async function logoutJudge() {

    try {

        if (
            STATE.sessionToken
        ) {

            await judgeApi(
                "judgeLogout"
            );

        }

    }

    catch (error) {

        console.warn(
            error
        );

    }


    clearSession();

    showLogin();


    showToast(
        "已登出評審系統"
    );

}


/* ============================================================
   啟動
   ============================================================ */

async function initializeJudgePage() {

    const token =
        sessionStorage.getItem(
            SESSION_KEY
        );


    if (
        !token
    ) {

        showLogin();

        return;

    }


    STATE.sessionToken =
        token;


    try {

        const result =
            await judgeApi(
                "judgeMe"
            );


        if (
            isUnauthorized(
                result
            )
        ) {

            return;

        }


        if (
            !result.success
        ) {

            throw new Error(
                result.message
                ||
                "登入已失效"
            );

        }


        STATE.judge =
            result.judge
            ||
            result.user
            ||
            null;


        showApp();


        await loadDashboard();

    }

    catch (error) {

        clearSession();

        showLogin();


        $("loginError")
            .textContent =
            "登入已失效，請重新登入。";

    }

}


document.addEventListener(
    "DOMContentLoaded",
    initializeJudgePage
);


/* ============================================================
   Dashboard
   ============================================================ */

async function loadDashboard() {

    $("clubArea")
        .className =
        "state";


    $("clubArea")
        .innerHTML = `

            <div class="spinner"></div>

            正在讀取評分資料...

        `;


    try {

        const result =
            await judgeApi(
                "judgeScoreDashboard"
            );


        if (
            isUnauthorized(
                result
            )
        ) {

            return;

        }


        if (
            !result.success
        ) {

            throw new Error(

                result.message
                ||
                "無法取得評分資料"

            );

        }


        STATE.dashboard =
            result;


        STATE.judge =
            result.judge
            ||
            STATE.judge;


        STATE.stages =
            normalizeDashboardStages(
                result.stages
            );


        if (
            !STATE.currentStageKey

            ||

            !STATE.stages.some(
                stage =>
                    stage.stageKey ===
                    STATE.currentStageKey
            )
        ) {

            const firstAvailable =
                STATE.stages.find(
                    stage =>
                        stage.available
                );


            STATE.currentStageKey =

                firstAvailable

                ? firstAvailable.stageKey

                : (
                    STATE.stages[
                        0
                    ]
                    ?.stageKey
                    ||
                    null
                  );

        }


        renderJudgeInfo();

        renderStageTabs();

        renderCurrentStage();

    }

    catch (error) {

        $("clubArea")
            .className =
            "state";


        $("clubArea")
            .innerHTML =

            "⚠️ " +
            escapeHtml(
                error.message
            );

    }

}


/* ============================================================
   Dashboard stages 正規化
   ============================================================ */

function normalizeDashboardStages(
    stages
) {

    if (
        Array.isArray(
            stages
        )
    ) {

        return stages;

    }


    if (
        stages &&
        typeof stages ===
        "object"
    ) {

        return Object
            .values(
                stages
            );

    }


    return [];

}


/* ============================================================
   評審資料
   ============================================================ */

function renderJudgeInfo() {

    const judge =
        STATE.judge
        ||
        {};


    $("judgeDisplayName")
        .textContent =

        judge.displayName

        ||

        judge.name

        ||

        judge.username

        ||

        "評審";


    const categories =

        STATE.dashboard &&
        Array.isArray(
            STATE.dashboard
                .assignedCategories
        )

        ? STATE.dashboard
            .assignedCategories

        : (
            Array.isArray(
                judge.categories
            )

            ? judge.categories

            : []
          );


    $("judgeCategories")
        .innerHTML =

        categories.length

        ? categories
            .map(
                category => `

                    <span class="category-chip">
                        ${escapeHtml(category)}
                    </span>

                `
            )
            .join(
                ""
            )

        : `
          <span class="category-chip">
              尚未設定負責屬性
          </span>
          `;


    $("statTotalClubs")
        .textContent =

        STATE.dashboard
            ?.assignedClubCount

        ??

        0;

}


/* ============================================================
   Stage Tabs
   ============================================================ */

function renderStageTabs() {

    const container =
        $("stageTabs");


    if (
        !STATE.stages.length
    ) {

        container.innerHTML =
            "";

        return;

    }


    container.innerHTML =

        STATE.stages
            .map(
                stage => {

                    const active =

                        stage.stageKey ===
                        STATE.currentStageKey;


                    return `

                    <button
                        class="stage-tab ${active ? "active" : ""}"
                        onclick="selectStage('${encodeURIComponent(stage.stageKey)}')"
                    >

                        ${escapeHtml(stage.icon || "📌")}

                        ${escapeHtml(stage.stageName || stage.stageKey)}

                        ${
                            stage.published

                            ? ""

                            : " 🔒"
                        }

                    </button>

                    `;

                }
            )
            .join(
                ""
            );

}


function selectStage(
    encoded
) {

    STATE.currentStageKey =
        decodeURIComponent(
            encoded
        );


    STATE.statusFilter =
        "all";


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "active",

                    button.dataset.filter ===
                    "all"

                );

            }
        );


    renderStageTabs();

    renderCurrentStage();

}


/* ============================================================
   目前 Stage
   ============================================================ */

function getCurrentStageDashboard() {

    return (

        STATE.stages
            .find(
                stage =>
                    stage.stageKey ===
                    STATE.currentStageKey
            )

        ||

        null

    );

}


/* ============================================================
   篩選
   ============================================================ */

function setStatusFilter(
    value,
    button
) {

    STATE.statusFilter =
        value;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            item => {

                item.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    renderCurrentStage();

}


/* ============================================================
   Render 社團
   ============================================================ */

function renderCurrentStage() {

    const stage =
        getCurrentStageDashboard();


    if (
        !stage
    ) {

        $("statSubmitted")
            .textContent =
            "0";


        $("statDraft")
            .textContent =
            "0";


        $("statNotStarted")
            .textContent =
            "0";


        $("clubArea")
            .className =
            "state";


        $("clubArea")
            .innerHTML =
            "目前沒有評分大項。";


        return;

    }


    $("statSubmitted")
        .textContent =
        stage.submittedCount
        ??
        0;


    $("statDraft")
        .textContent =
        stage.draftCount
        ??
        0;


    $("statNotStarted")
        .textContent =
        stage.notStartedCount
        ??
        0;


    if (
        !stage.available
    ) {

        $("clubArea")
            .className =
            "state";


        $("clubArea")
            .innerHTML = `

            🔒
            <br><br>

            「${escapeHtml(stage.stageName)}」
            目前尚未開放評分。

        `;


        return;

    }


    const query =

        (
            $("clubSearch")
                .value
            ||
            ""
        )
        .trim()
        .toLowerCase();


    const clubs =
        (
            stage.clubs
            ||
            []
        )
        .filter(
            club => {

                const searchMatched =

                    !query

                    ||

                    (
                        `${club.name} ${club.category}`
                    )
                    .toLowerCase()
                    .includes(
                        query
                    );


                const statusMatched =

                    STATE.statusFilter ===
                    "all"

                    ||

                    club.status ===
                    STATE.statusFilter;


                return (

                    searchMatched

                    &&

                    statusMatched

                );

            }
        );


    if (
        !clubs.length
    ) {

        $("clubArea")
            .className =
            "state";


        $("clubArea")
            .innerHTML =
            "找不到符合條件的社團。";


        return;

    }


    const grouped =
        {};


    clubs.forEach(
        club => {

            const category =
                club.category
                ||
                "未分類";


            if (
                !grouped[
                    category
                ]
            ) {

                grouped[
                    category
                ] =
                    [];

            }


            grouped[
                category
            ]
            .push(
                club
            );

        }
    );


    $("clubArea")
        .className =
        "";


    $("clubArea")
        .innerHTML =

        Object
            .entries(
                grouped
            )
            .map(
                (
                    [
                        category,
                        categoryClubs
                    ]
                ) => `

                <section class="category-block">

                    <div class="category-title">

                        <span>
                            📂
                            ${escapeHtml(category)}
                        </span>

                        <span class="category-count">
                            ${categoryClubs.length} 個社團
                        </span>

                    </div>


                    <div class="club-list">

                        ${
                            categoryClubs
                                .map(
                                    club =>
                                        clubCardHtml(
                                            club,
                                            stage
                                        )
                                )
                                .join(
                                    ""
                                )
                        }

                    </div>

                </section>

                `
            )
            .join(
                ""
            );

}


/* ============================================================
   社團卡
   ============================================================ */

function clubCardHtml(
    club,
    stage
) {

    let statusHtml =
        "";


    let buttonText =
        "開始評分";


    if (
        club.status ===
        "submitted"
    ) {

        statusHtml = `

            <span class="status status-submitted">
                ✅ 已送出
            </span>

        `;


        buttonText =
            "查看成績";

    }

    else if (
        club.status ===
        "draft"
    ) {

        statusHtml = `

            <span class="status status-draft">
                📝 草稿
            </span>

        `;


        buttonText =
            "繼續評分";

    }

    else {

        statusHtml = `

            <span class="status status-none">
                尚未開始
            </span>

        `;

    }


    const scoreText =

        club.totalScore !==
        null

        &&

        club.totalScore !==
        undefined

        ? `｜目前 ${formatScore(club.totalScore)} / ${formatScore(stage.maxScore)}`

        : "";


    return `

    <div class="club-card">

        <div>

            <div class="club-name">

                ${escapeHtml(club.name)}

                ${statusHtml}

            </div>


            <div class="club-meta">

                ${escapeHtml(club.category)}

                ${scoreText}

                ${
                    club.criterionCount

                    ? `｜已評 ${club.answeredCount || 0}/${club.criterionCount} 項`

                    : ""
                }

            </div>

        </div>


        <button
            class="btn ${
                club.status ===
                "submitted"
                ? ""
                : "btn-primary"
            }"
            onclick="openScore('${encodeURIComponent(club.name)}')"
        >
            ${buttonText}
        </button>

    </div>

    `;

}


/* ============================================================
   開啟評分
   ============================================================ */

async function openScore(
    encodedClubName
) {

    const clubName =
        decodeURIComponent(
            encodedClubName
        );


    const stage =
        getCurrentStageDashboard();


    if (
        !stage
    ) {

        return;

    }


    STATE.currentClub =
        null;


    STATE.currentStage =
        null;


    STATE.currentRecord =
        null;


    STATE.locked =
        false;


    $("scoreModalTitle")
        .textContent =
        clubName;


    $("scoreModalSub")
        .textContent =
        "正在讀取評分資料...";


    $("scoreModalBody")
        .innerHTML = `

            <div class="state">

                <div class="spinner"></div>

                載入中...

            </div>

        `;


    $("scoreFooterActions")
        .style
        .display =
        "none";


    $("saveInfo")
        .textContent =
        "";


    openScoreModal();


    try {

        const result =
            await judgeApi(

                "judgeGetScore",

                {

                    stageKey:
                        stage.stageKey,

                    clubName:
                        clubName

                }

            );


        if (
            isUnauthorized(
                result
            )
        ) {

            closeScoreModal();

            return;

        }


        if (
            !result.success
        ) {

            throw new Error(

                result.message

                ||

                "無法取得評分資料"

            );

        }


        STATE.currentClub =
            result.club;


        STATE.currentStage =
            result.stage;


        STATE.currentRecord =
            result.record;


        STATE.locked =
            Boolean(
                result.locked
            );


        $("scoreModalTitle")
            .textContent =
            result.club.name;


        $("scoreModalSub")
            .textContent =

            `${result.club.category}｜${result.stage.icon || "📌"} ${result.stage.name}`;


        renderScoreModal();


        if (
            result.staleDraft
        ) {

            showToast(
                "⚠️ 此草稿使用的是舊版評分規則，請重新確認分數"
            );

        }

    }

    catch (error) {

        $("scoreModalBody")
            .innerHTML = `

                <div class="state">
                    ⚠️
                    ${escapeHtml(error.message)}
                </div>

            `;

    }

}


/* ============================================================
   Modal 開關
   ============================================================ */

function openScoreModal() {

    $("scoreModalBg")
        .style
        .display =
        "flex";

}


function closeScoreModal() {

    $("scoreModalBg")
        .style
        .display =
        "none";

}


/* ============================================================
   取得小項目前分數
   ============================================================ */

function getCurrentScoreValue(
    criterionId
) {

    const record =
        STATE.currentRecord;


    if (
        !record

        ||

        !record.scores
    ) {

        return "";

    }


    const value =
        record.scores[
            criterionId
        ];


    if (
        value ===
        null

        ||

        value ===
        undefined

        ||

        value ===
        ""
    ) {

        return "";

    }


    return value;

}


/* ============================================================
   評分畫面
   ============================================================ */

function renderScoreModal() {

    const stage =
        STATE.currentStage;


    if (
        !stage
    ) {

        return;

    }


    const groups =
        Array.isArray(
            stage.groups
        )

        ? stage.groups.filter(
            group =>
                group.enabled !==
                false
          )

        : [];


    let body =
        "";


    if (
        STATE.locked
    ) {

        body += `

        <div class="locked-box">

            🔒 此評分已正式送出並鎖定，
            目前只能查看，無法再修改。

        </div>

        `;

    }


    body += `

    <div class="score-summary">

        <div>

            <div class="summary-label">
                ${escapeHtml(stage.name)}目前總分
            </div>

            <div class="summary-score">

                <span id="currentTotal">
                    0
                </span>

                /

                ${formatScore(stage.maxScore)}

            </div>

        </div>


        <div
            id="answeredProgress"
            class="summary-label"
        >
            0 / 0 項
        </div>

    </div>

    `;


    groups.forEach(
        group => {

            body += `

            <section class="score-group">

                <div class="group-head">

                    <div class="group-name">
                        ${escapeHtml(group.name)}
                    </div>

                    <div class="group-score">

                        <span
                            id="groupScore_${escapeHtml(group.id)}"
                        >
                            0
                        </span>

                        /

                        ${formatScore(group.maxScore)}

                    </div>

                </div>


                <div class="criteria-list">

            `;


            (
                group.criteria
                ||
                []
            )
            .filter(
                criterion =>
                    criterion.enabled !==
                    false
            )
            .forEach(
                criterion => {

                    const value =
                        getCurrentScoreValue(
                            criterion.id
                        );


                    body += `

                    <div class="criterion">

                        <div>

                            <div class="criterion-name">
                                ${escapeHtml(criterion.name)}
                            </div>

                            <div class="criterion-max">
                                最高 ${formatScore(criterion.maxScore)} 分
                            </div>

                        </div>


                        <div class="score-input-wrap">

                            <input
                                id="score_${escapeHtml(criterion.id)}"
                                class="score-input"
                                type="number"
                                min="0"
                                max="${formatScore(criterion.maxScore)}"
                                step="0.01"
                                value="${escapeHtml(value)}"
                                data-criterion-id="${escapeHtml(criterion.id)}"
                                data-group-id="${escapeHtml(group.id)}"
                                data-max="${formatScore(criterion.maxScore)}"
                                ${STATE.locked ? "disabled" : ""}
                                oninput="scoreChanged(this)"
                            >

                            <span class="out-of">
                                /
                                ${formatScore(criterion.maxScore)}
                            </span>

                        </div>

                    </div>

                    `;

                }
            );


            body += `

                </div>

            </section>

            `;

        }
    );


    body += `

    <div
        id="scoreWarning"
        class="score-warning"
    ></div>

    `;


    $("scoreModalBody")
        .innerHTML =
        body;


    if (
        STATE.locked
    ) {

        $("scoreFooterActions")
            .style
            .display =
            "none";


        $("saveInfo")
            .textContent =

            STATE.currentRecord &&
            STATE.currentRecord.submittedAt

            ? "正式送出：" +
              formatDateTime(
                  STATE.currentRecord.submittedAt
              )

            : "已正式送出";

    }

    else {

        $("scoreFooterActions")
            .style
            .display =
            "flex";


        $("saveInfo")
            .textContent =

            STATE.currentRecord &&
            STATE.currentRecord.updatedAt

            ? "草稿更新：" +
              formatDateTime(
                  STATE.currentRecord.updatedAt
              )

            : "尚未儲存";

    }


    recalculateScore();

}


/* ============================================================
   輸入變化
   ============================================================ */

function scoreChanged(
    input
) {

    input.classList.remove(
        "invalid"
    );


    recalculateScore();

}


/* ============================================================
   取得畫面分數
   ============================================================ */

function collectScores() {

    const scores =
        {};


    document
        .querySelectorAll(
            "#scoreModalBody .score-input"
        )
        .forEach(
            input => {

                const id =
                    input.dataset
                        .criterionId;


                const raw =
                    input.value.trim();


                scores[
                    id
                ] =

                    raw ===
                    ""

                    ? null

                    : Number(
                        raw
                    );

            }
        );


    return scores;

}


/* ============================================================
   前端即時計算
   ============================================================ */

function calculateCurrentScore() {

    const stage =
        STATE.currentStage;


    const scores =
        collectScores();


    let total =
        0;


    let answered =
        0;


    let criterionCount =
        0;


    const groupResults =
        [];


    let valid =
        true;


    const errors =
        [];


    (
        stage.groups
        ||
        []
    )
    .filter(
        group =>
            group.enabled !==
            false
    )
    .forEach(
        group => {

            let groupTotal =
                0;


            let groupAnswered =
                0;


            let groupCount =
                0;


            (
                group.criteria
                ||
                []
            )
            .filter(
                criterion =>
                    criterion.enabled !==
                    false
            )
            .forEach(
                criterion => {

                    criterionCount++;

                    groupCount++;


                    const value =
                        scores[
                            criterion.id
                        ];


                    const input =
                        $(
                            "score_" +
                            criterion.id
                        );


                    if (
                        value ===
                        null

                        ||

                        value ===
                        undefined

                        ||

                        value ===
                        ""
                    ) {

                        return;

                    }


                    answered++;

                    groupAnswered++;


                    const number =
                        Number(
                            value
                        );


                    if (
                        !Number.isFinite(
                            number
                        )
                    ) {

                        valid =
                            false;


                        errors.push(
                            `「${criterion.name}」不是有效數字。`
                        );


                        if (
                            input
                        ) {

                            input.classList.add(
                                "invalid"
                            );

                        }


                        return;

                    }


                    if (
                        number <
                        0
                    ) {

                        valid =
                            false;


                        errors.push(
                            `「${criterion.name}」不能低於 0 分。`
                        );


                        if (
                            input
                        ) {

                            input.classList.add(
                                "invalid"
                            );

                        }

                    }


                    if (
                        number >
                        numberValue(
                            criterion.maxScore
                        )
                    ) {

                        valid =
                            false;


                        errors.push(

                            `「${criterion.name}」最高只能給 ` +
                            `${formatScore(criterion.maxScore)} 分。`

                        );


                        if (
                            input
                        ) {

                            input.classList.add(
                                "invalid"
                            );

                        }

                    }


                    groupTotal +=
                        number;

                }
            );


            groupTotal =
                numberValue(
                    groupTotal
                );


            if (
                groupTotal >
                numberValue(
                    group.maxScore
                )
            ) {

                valid =
                    false;


                errors.push(

                    `分類「${group.name}」目前 ${formatScore(groupTotal)} 分，` +
                    `超過上限 ${formatScore(group.maxScore)} 分。`

                );

            }


            total +=
                groupTotal;


            groupResults.push({

                id:
                    group.id,

                name:
                    group.name,

                score:
                    groupTotal,

                maxScore:
                    numberValue(
                        group.maxScore
                    ),

                answered:
                    groupAnswered,

                count:
                    groupCount

            });

        }
    );


    total =
        numberValue(
            total
        );


    if (
        total >
        numberValue(
            stage.maxScore
        )
    ) {

        valid =
            false;


        errors.push(

            `「${stage.name}」目前總分 ${formatScore(total)}，` +
            `超過上限 ${formatScore(stage.maxScore)} 分。`

        );

    }


    return {

        scores:
            scores,

        total:
            total,

        answered:
            answered,

        criterionCount:
            criterionCount,

        complete:
            answered ===
            criterionCount,

        groups:
            groupResults,

        valid:
            valid,

        errors:
            errors

    };

}


/* ============================================================
   更新即時計算
   ============================================================ */

function recalculateScore() {

    if (
        !STATE.currentStage
    ) {

        return;

    }


    document
        .querySelectorAll(
            ".score-input"
        )
        .forEach(
            input => {

                input.classList.remove(
                    "invalid"
                );

            }
        );


    const result =
        calculateCurrentScore();


    $("currentTotal")
        .textContent =
        formatScore(
            result.total
        );


    $("answeredProgress")
        .textContent =

        `${result.answered} / ${result.criterionCount} 項`;


    result.groups.forEach(
        group => {

            const element =
                $(
                    "groupScore_" +
                    group.id
                );


            if (
                element
            ) {

                element.textContent =
                    formatScore(
                        group.score
                    );

            }

        }
    );


    const warning =
        $("scoreWarning");


    if (
        result.errors.length
    ) {

        warning.classList.add(
            "show"
        );


        warning.innerHTML =

            "⚠️ 請確認以下分數：<br>" +

            result.errors
                .map(
                    error =>
                        "• " +
                        escapeHtml(
                            error
                        )
                )
                .join(
                    "<br>"
                );

    }

    else {

        warning.classList.remove(
            "show"
        );


        warning.innerHTML =
            "";

    }


    $("saveDraftBtn")
        .disabled =
        !result.valid;


    $("submitScoreBtn")
        .disabled =
        !result.valid;

}


/* ============================================================
   儲存草稿
   ============================================================ */

async function saveDraft() {

    if (
        STATE.locked
        ||
        !STATE.currentClub
        ||
        !STATE.currentStage
    ) {

        return;

    }


    const calculated =
        calculateCurrentScore();


    if (
        !calculated.valid
    ) {

        showToast(
            "❌ 有分數超過限制，請先修正"
        );

        return;

    }


    const button =
        $("saveDraftBtn");


    try {

        button.disabled =
            true;


        button.textContent =
            "儲存中...";


        const result =
            await judgeApi(

                "judgeSaveScoreDraft",

                {

                    stageKey:
                        STATE.currentStage.id
                        ||
                        STATE.currentStage.key,

                    clubName:
                        STATE.currentClub.name,

                    scores:
                        calculated.scores

                }

            );


        if (
            isUnauthorized(
                result
            )
        ) {

            closeScoreModal();

            return;

        }


        if (
            !result.success
        ) {

            throw new Error(

                result.message
                ||
                "草稿儲存失敗"

            );

        }


        STATE.currentRecord =
            result.record;


        $("saveInfo")
            .textContent =

            "草稿更新：" +

            formatDateTime(
                result.record.updatedAt
            );


        showToast(
            "✅ 草稿已儲存"
        );


        await loadDashboard();

    }

    catch (error) {

        showToast(

            "❌ " +

            error.message

        );

    }

    finally {

        button.disabled =
            false;


        button.textContent =
            "💾 儲存草稿";


        recalculateScore();

    }

}


/* ============================================================
   正式送出
   ============================================================ */

async function submitScore() {

    if (
        STATE.locked
        ||
        !STATE.currentClub
        ||
        !STATE.currentStage
    ) {

        return;

    }


    const calculated =
        calculateCurrentScore();


    if (
        !calculated.valid
    ) {

        showToast(
            "❌ 有分數超過限制，請先修正"
        );

        return;

    }


    if (
        !calculated.complete
    ) {

        showToast(
            "⚠️ 尚有評分小項未填寫；0 分可以，但不能留白"
        );

        return;

    }


    const clubName =
        STATE.currentClub.name;


    const stageName =
        STATE.currentStage.name;


    const total =
        calculated.total;


    const max =
        STATE.currentStage.maxScore;


    const confirmed =
        confirm(

            `確定正式送出？\n\n` +

            `社團：${clubName}\n` +

            `項目：${stageName}\n` +

            `總分：${formatScore(total)} / ${formatScore(max)}\n\n` +

            `送出後將鎖定，評審端不能自行修改。`

        );


    if (
        !confirmed
    ) {

        return;

    }


    const button =
        $("submitScoreBtn");


    try {

        button.disabled =
            true;


        button.textContent =
            "送出中...";


        const result =
            await judgeApi(

                "judgeSubmitScore",

                {

                    stageKey:
                        STATE.currentStage.id
                        ||
                        STATE.currentStage.key,

                    clubName:
                        clubName,

                    scores:
                        calculated.scores

                }

            );


        if (
            isUnauthorized(
                result
            )
        ) {

            closeScoreModal();

            return;

        }


        if (
            !result.success
        ) {

            throw new Error(

                result.message
                ||
                "正式送出失敗"

            );

        }


        STATE.currentRecord =
            result.record;


        STATE.locked =
            true;


        showToast(
            "✅ 評分已正式送出並鎖定"
        );


        await loadDashboard();


        renderScoreModal();

    }

    catch (error) {

        showToast(

            "❌ " +

            error.message

        );

    }

    finally {

        button.disabled =
            false;


        button.textContent =
            "✅ 正式送出";

    }

}


/* ============================================================
   日期
   ============================================================ */

function formatDateTime(
    value
) {

    if (
        !value
    ) {

        return "-";

    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(
            value
        );

    }


    return new Intl.DateTimeFormat(

        "zh-TW",

        {

            timeZone:
                "Asia/Taipei",

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit",

            hour12:
                false

        }

    )
    .format(
        date
    );

}


/* ============================================================
   Modal 背景點擊
   ============================================================ */

$("scoreModalBg")
    .addEventListener(

        "click",

        event => {

            if (
                event.target ===
                event.currentTarget
            ) {

                closeScoreModal();

            }

        }

    );


/* ============================================================
   ESC
   ============================================================ */

document.addEventListener(

    "keydown",

    event => {

        if (
            event.key ===
            "Escape"
        ) {

            closeScoreModal();

        }

    }

);

</script>
