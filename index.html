        /* =====================================================
           基本設定
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            background: #f4f6f8;

            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                Roboto,
                sans-serif;

            color: #202124;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            -webkit-tap-highlight-color: transparent;
        }



        /* =====================================================
           主畫面
           ===================================================== */

        .chat-container {

            position: relative;

            width: 100%;

            height: 100vh;

            height:
                calc(var(--vh, 1vh) * 100);

            display: flex;

            flex-direction: column;

            background: #f4f6f8;

            overflow: hidden;
        }



        /* =====================================================
           中央背景浮水印
           ===================================================== */

        .chat-container::before {

            content: "";

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 260px;
            height: 260px;

            background-image:
                url("./bg-logo.png");

            background-repeat:
                no-repeat;

            background-position:
                center;

            background-size:
                contain;

            opacity: 0.07;

            pointer-events: none;

            z-index: 0;
        }



        /* =====================================================
           Header
           ===================================================== */

        .chat-header {

            position: relative;

            z-index: 20;

            flex-shrink: 0;

            padding:
                calc(
                    14px +
                    env(safe-area-inset-top)
                )
                16px
                12px;

            background:
                linear-gradient(
                    135deg,
                    #1a73e8,
                    #1557b0
                );

            color: white;

            text-align: center;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.08);
        }


        .header-title {

            font-size: 16px;

            font-weight: 700;

            letter-spacing: 0.3px;
        }


        .identity-chip {

            display: inline-block;

            margin-top: 6px;

            padding:
                3px 9px;

            border-radius:
                999px;

            background:
                rgba(255,255,255,0.16);

            font-size:
                11px;

            color:
                rgba(255,255,255,0.95);
        }



        /* =====================================================
           聊天訊息區
           ===================================================== */

        .chat-messages {

            position: relative;

            z-index: 2;

            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 12px;

            padding: 16px;

            overflow-y: auto;

            -webkit-overflow-scrolling:
                touch;

            background:
                transparent;

            scroll-behavior:
                smooth;
        }


        .message {

            max-width: 88%;

            padding:
                12px 15px;

            border-radius:
                18px;

            font-size:
                15px;

            line-height:
                1.6;

            word-break:
                break-word;
        }


        .message.bot {

            align-self:
                flex-start;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            color:
                #202124;

            border:
                1px solid #e8eaed;

            border-bottom-left-radius:
                5px;

            box-shadow:
                0 2px 5px
                rgba(0,0,0,0.04);
        }


        .message.user {

            align-self:
                flex-end;

            background:
                #1a73e8;

            color:
                white;

            border-bottom-right-radius:
                5px;

            box-shadow:
                0 2px 5px
                rgba(26,115,232,0.18);
        }



        /* =====================================================
           快捷鍵
           ===================================================== */

        .quick-tags-container {

            position: relative;

            z-index: 10;

            flex-shrink: 0;

            display: flex;

            gap: 8px;

            padding:
                9px
                13px
                5px;

            overflow-x: auto;

            white-space:
                nowrap;

            background:
                rgba(
                    244,
                    246,
                    248,
                    0.96
                );

            -webkit-overflow-scrolling:
                touch;
        }


        .quick-tags-container::-webkit-scrollbar {

            display: none;
        }


        .quick-tag {

            flex-shrink: 0;

            border:
                1px solid #1a73e8;

            border-radius:
                18px;

            padding:
                8px 14px;

            background:
                white;

            color:
                #1a73e8;

            font-size:
                13px;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                0.2s;
        }


        .quick-tag:active {

            transform:
                scale(0.97);

            background:
                #1a73e8;

            color:
                white;
        }



        /* =====================================================
           主輸入框
           ===================================================== */

        .chat-input-area {

            position: relative;

            z-index: 20;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            gap: 9px;

            padding:
                11px
                13px

                    11px +
                    env(safe-area-inset-bottom)

            background:
                white;

            border-top:
                1px solid #dadce0;

            box-shadow:
                0 -2px 10px

        }


        .chat-input {

            flex: 1;

            min-width: 0;

            height: 43px;

            padding:
                0 17px;

            border:
                1px solid #dadce0;

            border-radius:
                23px;

            outline:
                none;

            background:
                #f1f3f4;

            font-size:
                16px;

            -webkit-appearance:
                none;
        }

            background:
                white;

            border-color:
                #1a73e8;

            box-shadow:
                0 0 0 2px
                rgba(26,115,232,0.08);
        }


        .send-btn {

            flex-shrink: 0;

            height: 43px;

            padding:
                0 20px;

            border:
                none;

            border-radius:
                23px;

            background:
                #1a73e8;

            color:
                white;

            font-size:
                14px;

            font-weight:
                700;

            cursor:
                pointer;
        }

           社團總攬
           ===================================================== */

        .club-category-container {

            display: flex;

            flex-wrap:
                wrap;

            gap: 8px;

            margin-top:
                10px;
        }


        .club-category-btn {

            border:

            border-radius:
                18px;

            padding:
                7px 12px;

            background:
                white;

            color:
                #1a73e8;

            font-size:
                13px;

            font-weight:
                650;

            cursor:
                pointer;
        }

            background:
                #1a73e8;

            color:
                white;
        }



        /* =====================================================
           社團列表
           ===================================================== */

        .club-list {

            display: flex;

            flex-direction:

            gap: 7px;

            margin-top:
                11px;
        }

            display: flex;

            align-items:

            padding:

            border:

            border-radius:
                10px;

            background:

        }

            justify-content:

            height: 26px;

            background:
                #e8f0fe;

            color:
                #1a73e8;

            font-size:
                12px;

            font-weight:
                800;
        }

           ===================================================== */

            border:

            border-radius:
                13px;

            background:

        }

            margin-bottom:
                4px;

            font-size:
                16px;

            font-weight:
                800;
        }


        .binding-description {

            margin-bottom:

            font-size:

            border:

            border-radius:
                10px;

            background:
                white;

            font-size:
                15px;

        }


        .binding-feedback {

                8px;

            font-size:
                13px;
        }


        .error-text {

            color:
                #b42318;
        }


        .success-text {

            color:
                #167542;
        }



        /* =====================================================
           按鈕
           ===================================================== */

        .action-row {

            display: flex;

            flex-wrap:
                wrap;

            gap: 8px;

            margin-top:
                12px;
        }


        .action-btn {

            border:

            border-radius:
                10px;

            padding:
                9px 14px;

            font-size:
                13px;

            font-weight:
                700;

            cursor:

        }


        .action-primary {

            background:

            color:

        }


        .action-secondary {

            background:

            color:

        }


        .action-danger {

            background:
                #fdecec;

            color:
                #b42318;
        }


        .action-disabled {

            background:
                #e8eaed;

            color:
                #80868b;

            cursor:

        }

           資料卡
           ===================================================== */

        .info-card {

            margin-top:

            padding:

            border-radius:
                12px;

            border:
                1px solid #e4e7eb;

            background:
                #f8f9fa;
        }


        .info-row {

            padding:

                12px;
        }

        (max-width: 420px) {

/* ============================================================

   ============================================================ */

function resetVH() {

    const vh =
        window.innerHeight *
        0.01;


    document.documentElement
        .style
        .setProperty(
            "--vh",
            `${vh}px`
        );

}


window.addEventListener(
    "resize",
    resetVH
);


window.addEventListener(
    "orientationchange",

);

/* ============================================================
   LIFF 初始化
   ============================================================ */

document.addEventListener(

    "DOMContentLoaded",

    async function () {


        resetVH();


        await initializeIdentity();


    }

);



async function initializeIdentity() {


    const identityChip =

        document.getElementById(
            "identityChip"
        );


    try {


        if (
            typeof liff ===
            "undefined"
        ) {

            throw new Error(
                "LIFF SDK 未載入"
            );

        }


        await liff.init({

            liffId:
                LIFF_ID

        });



        if (
            liff.isLoggedIn()
        ) {


            const profile =

                await liff.getProfile();


            APP_STATE.userId =

                profile.userId;


            APP_STATE.displayName =

                profile.displayName;


            APP_STATE.isRealLineUser =

                true;


            identityChip.textContent =

                "LINE：" +
                profile.displayName;


        }


        else {


            if (
                FRONTEND_TEST_MODE
            ) {


                useDemoIdentity();


            }


            else {


                identityChip.textContent =

                    "請由 LINE 開啟";


            }

        }


    }


    catch (error) {


        console.warn(
            "LIFF 身分取得失敗：",
            error
        );


        if (
            FRONTEND_TEST_MODE
        ) {


            useDemoIdentity();


        }


        else {


            identityChip.textContent =

                "LINE 身分取得失敗";


        }

    }


    APP_STATE.identityReady =
        true;

}



function useDemoIdentity() {


    APP_STATE.userId =

        "FRONTEND_DEMO_USER";


    APP_STATE.displayName =

        "前端測試使用者";


    APP_STATE.isRealLineUser =

/*
⚠️ 目前使用 localStorage

正式後端完成後，
這兩個函式會改成呼叫後端 API。
*/


function getBindingStorageKey() {


    if (
        !APP_STATE.userId
    ) {

        return null;

    }


    return (

        "club_binding_" +
        APP_STATE.userId

    );

}



function getCurrentBinding() {


    const key =

        getBindingStorageKey();


    if (!key) {

        return null;

    }


    try {


        const data =

            localStorage.getItem(
                key
            );


        if (!data) {

            return null;

        }


        return JSON.parse(
            data
        );


    }


    catch (error) {


        console.error(
            error
        );


        return null;

    }

}



function saveCurrentBinding(
    binding
) {


    const key =

        getBindingStorageKey();


    if (!key) {

        return false;

    }


    localStorage.setItem(

        key,

        JSON.stringify(
            binding
        )

    );


    return true;

}



/* ============================================================
   安全顯示
   ============================================================ */

function escapeHtml(text) {


    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* ============================================================
   顯示訊息
   ============================================================ */

function appendMessage(
    content,
    sender,
    useHTML = false
) {


    const container =

        document.getElementById(
            "chatMessages"
        );


    const message =

        document.createElement(
            "div"
        );


    message.className =

        "message " +
        sender;


    if (useHTML) {


        message.innerHTML =
            content;


    }


    else {


        message.textContent =
            content;


    }


    container.appendChild(
        message
    );


    setTimeout(

        () => {


            container.scrollTo({

                top:
                    container.scrollHeight,

                behavior:
                    "smooth"

            });


        },

        30

    );

}



/* ============================================================

function findExactClub(
    inputName
) {


    const searchName =

        inputName.trim();


    for (

        const [
            category,
            clubs
        ]

        of Object.entries(
            CLUB_DATA
        )

    ) {


        const club =

            clubs.find(

                item =>

                    item.trim()
                    ===
                    searchName

            );


        if (club) {


            return {

                name:
                    club,

                category:
                    category

            };

        }

    }


    return null;

}

/* ============================================================
   綁定社團查詢
   ============================================================ */

function lookupBindingClub(
    panelId
) {


    const input =

        document.getElementById(
            panelId
        );


    const feedback =

        document.getElementById(
            panelId +
            "_feedback"
        );


    if (
        !input ||
        !feedback
    ) {

        return;

    }


    const value =

        input.value.trim();


    if (!value) {


        feedback.className =

            "binding-feedback error-text";


        feedback.textContent =

            "請先輸入社團完整名稱。";


        return;

    }



    const currentBinding =

        getCurrentBinding();



    if (
        currentBinding
    ) {


        feedback.className =

            "binding-feedback error-text";


        feedback.textContent =

            "此帳號已完成社團綁定，無法再次綁定。";


        return;

    }



    const result =

        findExactClub(
            value
        );



    if (!result) {


        APP_STATE.pendingBinding =
            null;


        feedback.className =

            "binding-feedback error-text";


        feedback.innerHTML =

            "❌ 查無此社團。<br>" +

            "請確認是否輸入完整正式名稱。";


        return;

    }



    feedback.className =

        "binding-feedback success-text";


    feedback.innerHTML =

        "✅ 已找到社團。";


    APP_STATE.pendingBinding =

        result;



    showBindingConfirmation(
        result
    );

}

/* ============================================================
   核心客服判斷
   ============================================================ */

function processMessage(
    rawQuery
) {


    const query =

        rawQuery.trim();


    if (!query) {

        return;

    }



    /*
    使用者訊息一定用純文字方式插入，
    避免 HTML 注入。
    */


    appendMessage(

        query,

        "user"

    );



    setTimeout(

        () => {



            /* ================================================
               社團總覽
               ================================================ */

            if (

                query ===
                "社團總覽"

                ||

                query ===
                "社團一覽"

                ||

                query ===
                "社團名單"

            ) {


                showClubOverview();


                return;

            }



            /* ================================================
               綁定
               ================================================ */

            if (

                query ===
                "社團綁定"

                ||

                query ===
                "綁定社團"

            ) {


                showBindingPanel();


                return;

            }



            /* ================================================
               社團雲端
               ================================================ */

            if (

                query ===
                "社團專屬雲端"

                ||

                query ===
                "社團雲端"

                ||

                query ===
                "雲端"

            ) {


                showCloudPanel();


                return;

            }



            /* ================================================
               五大屬性
               ================================================ */

            if (
                CLUB_DATA[
                    query
                ]
            ) {


                showClubCategory(
                    query
                );


                return;

            }



            /* ================================================
               社團完整名稱搜尋
               ================================================ */

            const exactClub =

                findExactClub(
                    query
                );



            if (
                exactClub
            ) {


                appendMessage(

                    `

                    🔎
                    <b>
                        ${escapeHtml(exactClub.name)}
                    </b>

                    <br><br>

                    社團屬性：

                    <b>
                        ${escapeHtml(exactClub.category)}
                    </b>

                    `,

                    "bot",

                    true

                );


                return;

            }



            /* ================================================
               FAQ
               ================================================ */

            for (

                const item

                of FAQ_DATA

            ) {


                const matched =

                    item.keywords.some(

                        keyword =>

                            query.includes(
                                keyword
                            )

                    );



                if (
                    matched
                ) {


                    appendMessage(

                        item.answer,

                        "bot",

                        true

                    );


                    return;

                }

            }



            /* ================================================
               找不到
               ================================================ */

            appendMessage(

                `

                抱歉，目前找不到符合的資料。

                <br><br>

                📌 若您正在查詢社團，

                請輸入

                <b>
                    「社團完整名稱」
                </b>

                。

                <br><br>

                也可以使用下方

                <b>
                    「📚 社團總覽」
                </b>

                查看完整名單，

                或聯絡學生議會協助確認。

                `,

                "bot",

                true

            );


        },

        220

    );

}


</script>


</body>

</html>
