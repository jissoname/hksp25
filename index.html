/* ============================================================

   ============================================================ */

async function initializeApp() {

    const ok =
        await initializeIdentity();


    if (!ok) {

        return;

    }


    /*
     * 只在登入完成時同步一次綁定狀態。

async function initializeIdentity() {

    const chip =
        document.getElementById(
            "identityChip"
        );


    try {

        if (
            typeof liff ===
            "undefined"
        ) {

            throw new Error(
                "LIFF SDK 未載入"
            );

        }


        await liff.init({

            liffId:
                LIFF_ID

        });


        if (
            !liff.isLoggedIn()
        ) {

            chip.textContent =
                "正在前往 LINE 登入...";


            liff.login({

                redirectUri:
                    window.location.href

            });


            return false;

        }


        const profile =
            await liff.getProfile();


        APP_STATE.displayName =
            profile.displayName;


        APP_STATE.identityReady =
            true;


        chip.textContent =

            "LINE：" +

            profile.displayName +

            " · 同步中";


        return true;

    }

    catch (error) {

        console.error(
            "LIFF 初始化失敗：",
            error
        );


        chip.textContent =
            "LINE 身分驗證失敗";


        APP_STATE.identityReady =
            false;


        return false;

    }

}


/* ============================================================
   LINE ID Token
   ============================================================ */

function getLineIDToken() {

    if (
        !APP_STATE.identityReady
    ) {

        return null;

    }


    try {

        return (
            liff.getIDToken() ||
            null
        );

    }

    catch (error) {

        console.error(
            "取得 ID Token 失敗：",
            error
        );


        return null;

    }

}


/* ============================================================
   後端 POST
   ============================================================ */

async function postBackend(
    payload
) {

    const controller =
        new AbortController();


    const timeout =
        setTimeout(

            () =>
                controller.abort(),

            15000

        );


    try {

        const response =

            await fetch(

                BACKEND_URL,

                {

                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            payload
                        ),

                    redirect:
                        "follow",

                    signal:
                        controller.signal

                }

            );


        if (
            !response.ok
        ) {

            throw new Error(

                "HTTP " +
                response.status

            );

        }


        const text =
            await response.text();


        try {

            return JSON.parse(
                text
            );

        }

        catch (error) {

            console.error(
                "後端原始回應：",
                text
            );


            throw new Error(
                "後端回傳格式錯誤"
            );

        }

    }

    finally {

        clearTimeout(
            timeout
        );

    }

}


/* ============================================================
   LINE 驗證後端
   ============================================================ */

async function callBackend(
    action,
    extraData = {}
) {

    const idToken =
        getLineIDToken();


    if (!idToken) {

        throw new Error(
            "無法取得 LINE ID Token"
        );

    }


    return postBackend({

        action:
            action,

        idToken:
            idToken,

        ...extraData

    });

}


/* ============================================================
   公開後端
   ============================================================ */

async function callPublicBackend(
    action,
    extraData = {}
) {

    return postBackend({

        action:
            action,

        ...extraData

    });

}

                    result.binding.club,

                category:
                    result.binding.category,

                createdAt:
                    result.binding.createdAt

            }

            : null;


        chip.textContent =

            "LINE：" +

            APP_STATE.displayName;


        return true;

    }

    catch (error) {

        console.error(
            "後端同步失敗：",
            error
        );


        APP_STATE.backendReady =
            false;


        APP_STATE.bindingChecked =
            false;


        chip.textContent =

            "LINE：" +

            (
                APP_STATE.displayName ||
                "使用者"
            ) +

            " · 同步失敗";


        if (!silent) {

            appendMessage(

                `
                ⚠️
                <b>
                    無法連線至綁定系統
                </b>

/* ============================================================
   HTML 安全
   ============================================================ */

function escapeHtml(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ============================================================
   顯示訊息
   ============================================================ */

function appendMessage(
    content,
    sender,
    useHTML = false
) {

    const container =
        document.getElementById(
            "chatMessages"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        sender;


    if (
        useHTML
    ) {

        message.innerHTML =
            content;

    }

    else {

        message.textContent =
            content;

    }


    container.appendChild(
        message
    );


    /*
     * 30ms 只處理畫面捲動，
     * 不會延遲客服回答。
     */
    setTimeout(

        () => {

            container.scrollTo({

                top:
                    container.scrollHeight,

                behavior:
                    "smooth"

            });

        },

        30

    );

}


/* ============================================================
   精準找社團
   ============================================================ */

function findExactClub(
    inputName
) {

    const searchName =
        inputName.trim();


    for (
        const [
            category,
            clubs
        ]

        of Object.entries(
            CLUB_DATA
        )
    ) {

        const club =

            clubs.find(

                item =>

                    item.trim()
                    ===
                    searchName

            );


        if (club) {

            return {

                name:
                    club,

                category:
                    category

            };

        }

    }


    return null;

}

/* ============================================================

function lookupBindingClub(
    id
) {

    const input =
        document.getElementById(
            id
        );


    const feedback =
        document.getElementById(

            id +
            "_feedback"

        );


    if (
        !input ||
        !feedback
    ) {

        return;

    }


    const value =
        input.value.trim();


    if (!value) {

        feedback.className =
            "binding-feedback error-text";


        feedback.textContent =
            "請先輸入社團完整名稱。";


        return;

    }


    if (
        APP_STATE.currentBinding
    ) {

        feedback.className =
            "binding-feedback error-text";


        feedback.textContent =
            "此帳號已完成社團綁定。";


        return;

    }


    const result =
        findExactClub(
            value
        );


    if (!result) {

        APP_STATE.pendingBinding =
            null;


        feedback.className =
            "binding-feedback error-text";


        feedback.innerHTML =

            "❌ 查無此社團。<br>" +

            "請確認是否輸入完整正式名稱。";


        return;

    }


    feedback.className =
        "binding-feedback success-text";


    feedback.textContent =
        "✅ 已找到社團。";


    APP_STATE.pendingBinding =
        result;


    showBindingConfirmation(
        result
    );

        appendMessage(

            "綁定資料已失效，請重新輸入社團名稱。",

            "bot"

        );


        return;

    }


    const button =
        document.getElementById(
            "confirmBindingBtn"
        );


    try {

        APP_STATE.bindingRequestRunning =
            true;


        if (button) {

            button.disabled =
                true;


            button.textContent =
                "綁定中...";

        }


        /*
         * 真正綁定時後端仍會再次驗證。
         * 所以拿掉前面的 checkBinding
         * 不會讓使用者重複綁定。
         */
        const result =

            await callBackend(

                "bindClub",

                {

                    clubName:
                        club.name

                }

            );


        if (
            result.error ===
            "ALREADY_BOUND"
        ) {

            if (
                result.binding
            ) {

                APP_STATE.currentBinding = {

   ============================================================ */

function getNowMs() {

    return (

        Date.now() +

        APP_STATE.serverTimeOffset

    );

}


function taipeiDateKey(
    ms
) {

    const parts =

        new Intl.DateTimeFormat(

            "en-CA",

            {

                timeZone:
                    "Asia/Taipei",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit"

            }

        )
        .formatToParts(
            new Date(ms)
        );


    const value = {};


    parts.forEach(

        part => {

            value[
                part.type
            ] =
                part.value;

        }

    );


    return (

        value.year +

        "-" +

        value.month +

        "-" +

        value.day

    );

}


function formatTaipeiDateTime(
    value
) {

    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return new Intl.DateTimeFormat(

        "zh-TW",

        {

            timeZone:
                "Asia/Taipei",

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit",

            hour12:
                false

        }

    )
    .format(
        date
    );

}


function formatTaipeiDate(
    value
) {

    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    const dateText =

        new Intl.DateTimeFormat(

            "zh-TW",

            {

                timeZone:
                    "Asia/Taipei",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit"

            }

        )
        .format(
            date
        );


    const weekday =

        new Intl.DateTimeFormat(

            "zh-TW",

            {

                timeZone:
                    "Asia/Taipei",

                weekday:
                    "short"

            }

        )
        .format(
            date
        )
        .replace(
            "週",
            ""
        );


    return (

        dateText +

        "（" +

        weekday +

        "）"

    );

}


function formatTaipeiTime(
    value
) {

    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return new Intl.DateTimeFormat(

        "zh-TW",

        {

            timeZone:
                "Asia/Taipei",

            hour:
                "2-digit",

            minute:
                "2-digit",

            hour12:
                false

        }

    )
    .format(
        date
    );

}


function countdownParts(
    target,
    now
) {

    let diff =

        Math.max(

            0,

            target -
            now

        );


    const days =

        Math.floor(

            diff /
            86400000

        );


    diff -=

        days *
        86400000;


    const hours =

        Math.floor(

            diff /
            3600000

        );


    diff -=

        hours *
        3600000;


    const minutes =

        Math.floor(

            diff /
            60000

        );


    return {

        days:
            days,

        hours:
            hours,

        minutes:
            minutes

    };

}


function deadlineStatus(
    value,
    now
) {

    const deadline =

        new Date(
            value
        )
        .getTime();


    if (
        !Number.isFinite(
            deadline
        )
    ) {

        return {

            text:
                "時間格式錯誤",

            className:
                "deadline-over"

        };

    }


    const diff =

        deadline -
        now;


    if (
        diff <=
        0
    ) {

        return {

            text:
                "🔴 已截止",

            className:
                "deadline-over"

        };

    }


    if (

        taipeiDateKey(
            deadline
        )

        ===

        taipeiDateKey(
            now
        )

    ) {

        const part =

            countdownParts(

                deadline,

                now

            );


        return {

            text:

                "🔥 今天截止・剩餘 " +

                part.hours +

                " 小時 " +

                part.minutes +

                " 分",

            className:
                "deadline-today"

        };

    }


    const remainingDays =

        Math.ceil(

            diff /
            86400000

        );


    if (
        remainingDays >
        7
    ) {

        return {

            text:

                "🟢 剩餘 " +

                remainingDays +

                " 天",

            className:
                "deadline-green"

        };

    }


    if (
        remainingDays >
        3
    ) {

        return {

            text:

                "🟡 剩餘 " +

                remainingDays +

                " 天",

            className:
                "deadline-yellow"

        };

    }


    return {

        text:

            "⚠️ 剩餘 " +

            remainingDays +

            " 天",

        className:
            "deadline-warning"

    };

}


function eventMainStatus(
    config,
    now
) {

    const start =

        new Date(
            config.eventStart
        )
        .getTime();


    const end =

        new Date(
            config.eventEnd
        )
        .getTime();


    if (
        !Number.isFinite(start) ||
        !Number.isFinite(end)
    ) {

        return "⚠️ 活動時間格式錯誤";

    }


    if (
        now >=
        end
    ) {

        return "✅ 本次活動已結束";

    }


    if (
        now >=
        start
    ) {

        return "🟢 活動進行中";

    }


    const part =

        countdownParts(

            start,

            now

        );


    if (

        taipeiDateKey(
            start
        )

        ===

        taipeiDateKey(
            now
        )

    ) {

        return (

            "🎉 活動就是今天！<br>" +

            "距離開始還有 " +

            part.hours +

            " 小時 " +

            part.minutes +

            " 分"

        );

    }


    return (

        "🎯 距離社團評選<br>" +

        "還有 " +

        part.days +

        " 天 " +

        part.hours +

        " 小時 " +

        part.minutes +

        " 分"

    );

}


function renderEventAnnouncement() {

    const box =

    if (!box) {

    }


    const config =

        deadlineStatus(

        );


    const formStatus =

        deadlineStatus(

            config.formDeadline,

            now

        );


    box.innerHTML = `

        <div class="event-countdown-main">

                    )
                }

        </div>

            <div class="event-deadline-name">

                ${
                    escapeHtml(

                            config.dataDeadline
                        )

                    )
                }

            </div>

            <span

                    event-deadline-status
                    ${dataStatus.className}
                "
            >

                ${

                        dataStatus.text
                    )
                }

            </span>

        </div>


        <div class="event-deadline-row">

            <div class="event-deadline-name">

                📝 表單填寫截止

            </div>

            <div class="event-deadline-date">

                ${
                    escapeHtml(

                        formatTaipeiDateTime(
                            config.formDeadline
                        )

                    )
                }

            </div>

            <span
                class="
                    event-deadline-status
                    ${formStatus.className}
                "
            >

                    )
                }

                }

            <br>

            ⏰

                escapeHtml(

                    )

                )
            }

            ${
                escapeHtml(

                    formatTaipeiTime(
                        config.eventEnd
                    )

            }

            <br>

            📍 弘光科技大學 毓麟館

        </div>

    `;

}


async function loadEventAnnouncement() {

    if (
        APP_STATE.eventRequestRunning
    ) {

        return;

    }


    try {

        APP_STATE.eventRequestRunning =
            true;


        const result =

            await callPublicBackend(
                "getEventConfig"
            );


        if (
            !result.success ||
            !result.config
        ) {

            throw new Error(

                result.message ||
                "無法取得活動時程"

            );

        }


        APP_STATE.eventConfig = {

            ...FALLBACK_EVENT_CONFIG,

            ...result.config

        };


        const serverTime =

            new Date(
                result.serverNow
            )
            .getTime();


        if (
            Number.isFinite(
                serverTime
            )
        ) {

            APP_STATE.serverTimeOffset =

                serverTime -

                Date.now();

        }

    }

    catch (error) {

        console.error(

            "活動時程載入失敗：",

            error

        );


        APP_STATE.eventConfig = {

            ...FALLBACK_EVENT_CONFIG

        };


        APP_STATE.serverTimeOffset =
            0;

    }

    finally {

        APP_STATE.eventRequestRunning =
            false;

    }


    renderEventAnnouncement();


    if (
        APP_STATE.eventCountdownTimer
    ) {

        clearInterval(
            APP_STATE.eventCountdownTimer
        );

    }


    APP_STATE.eventCountdownTimer =

        setInterval(

            renderEventAnnouncement,

            30000

        );

}

function openExternalUrl(
    url
) {

    try {

        if (
            typeof liff !==
            "undefined"

            &&

            liff.isInClient()
        ) {

            liff.openWindow({

                url:
                    url,

                external:
                    true

            });


            return;

        }

    }

    catch (error) {

        console.warn(
            error
        );

    }


    window.open(

        url,

        "_blank",

        "noopener,noreferrer"

    );

}

function handleFormSubmit(
    event
) {

    event.preventDefault();


    const input =
        document.getElementById(
            "userInput"
        );


    const query =
        input.value.trim();


    if (!query) {

        return;

    }


    input.value =
        "";


    processMessage(
        query
    );

}


/* ============================================================
   核心客服
   高速版：
   完全移除原本 220ms 人工等待
   ============================================================ */

async function processMessage(
    rawQuery
) {

    const query =
        rawQuery.trim();


    if (!query) {

        return;

    }


    appendMessage(
        query,
        "user"
    );


    /*
     * 沒有 setTimeout(220)。
     * 直接開始判斷並回答。
     */


    /* 活動時間 */

    if (
        query.includes(
            "活動時間"
        )
    ) {

        await showDynamicEventTime();

        return;

    }


    /* 社團總覽 */

    if (

        query ===
        "社團總覽"

        ||

        query ===
        "社團總攬"

        ||

        query ===
        "社團一覽"

        ||

        query ===
        "社團名單"

    ) {

        showClubOverview();

        return;

    }


    /* 社團綁定 */

    if (

        query ===
        "社團綁定"

        ||

        query ===
        "綁定社團"

    ) {

        await showBindingPanel();

        return;

    }


    /* 社團雲端 */

    if (

        query ===
        "社團專屬雲端"

        ||

        query ===
        "社團雲端"

        ||

        query ===
        "雲端"

    ) {

        await showCloudPanel();

        return;

    }


    /* 五大類 */

    if (
        CLUB_DATA[
            query
        ]
    ) {

        showClubCategory(
            query
        );

        return;

    }


    /* 完整社團名稱 */

    const exactClub =

        findExactClub(
            query
        );


    if (
        exactClub
    ) {

        appendMessage(

            `

            🔎

            <b>

                ${
                    escapeHtml(
                        exactClub.name
                    )
                }

            </b>

            <br><br>

            社團屬性：

            <b>

                ${
                    escapeHtml(
                        exactClub.category
                    )
                }

            </b>

            `,

            "bot",

            true

        );


        return;

    }


    /* FAQ */

    for (
        const item
        of FAQ_DATA
    ) {

        const matched =

            item
            .keywords
            .some(

                keyword =>

                    query.includes(
                        keyword
                    )

            );


        if (
            matched
        ) {

            appendMessage(

                item.answer,

                "bot",

                true

            );


            return;

        }

    }


    /* 找不到 */

    appendMessage(

        `

        抱歉，目前找不到符合的資料。

        <br><br>

        📌
        若您正在查詢社團，
        請輸入

        <b>
            「社團完整名稱」
        </b>。

        <br><br>

        也可以使用下方

        <b>
            「📚 社團總覽」
        </b>

        查看完整名單，
        或聯絡學生議會協助確認。

        `,

        "bot",

        true

    );

}
