/* ============================================================
   LIFF 身分
   ============================================================ */

async function initializeIdentity() {

    const identityChip =

        document.getElementById(
            "identityChip"
        );


    try {


        if (
            typeof liff ===
            "undefined"
        ) {

            throw new Error(
                "LIFF SDK 未載入"
            );

        }


        await liff.init({

            liffId:
                LIFF_ID

        });


        /*
        若從外部瀏覽器開啟，
        尚未登入 LINE，
        則導向 LINE Login。
        */

        if (
            !liff.isLoggedIn()
        ) {


            identityChip.textContent =

                "正在前往 LINE 登入...";


            liff.login({

                redirectUri:
                    window.location.href

            });


            return false;

        }


        const profile =

            await liff.getProfile();


        APP_STATE.displayName =

            profile.displayName;


        APP_STATE.identityReady =
            true;


        identityChip.textContent =

            "LINE：" +
            profile.displayName +
            " · 同步中";


        return true;

    }


    catch (error) {


        console.error(
            "LIFF 初始化失敗：",
            error
        );


        identityChip.textContent =

            "LINE 身分驗證失敗";


        APP_STATE.identityReady =
            false;


        return false;

    }

}


/* ============================================================
   取得 ID Token
   ============================================================ */

function getLineIDToken() {

    if (
        !APP_STATE.identityReady
    ) {

        return null;

    }


    try {

        const token =
            liff.getIDToken();


        if (!token) {

            return null;

        }


        return token;

    }

    catch (error) {

        console.error(
            "取得 ID Token 失敗：",
            error
        );


        return null;

    }

}


/* ============================================================
   呼叫後端
   ============================================================ */

async function callBackend(
    action,
    extraData = {}
) {

    const idToken =
        getLineIDToken();


    if (!idToken) {

        throw new Error(
            "無法取得 LINE ID Token"
        );

    }


    const payload = {

        action:
            action,

        idToken:
            idToken,

        ...extraData

    };


    const controller =
        new AbortController();


    const timeout =
        setTimeout(

            () =>
                controller.abort(),

            15000

        );


    try {


        /*
        不使用 application/json Header，
        讓請求保持較單純，
        Apps Script doPost 一樣可從
        e.postData.contents 解析 JSON 字串。
        */

        const response =
            await fetch(

                BACKEND_URL,

                {

                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            payload
                        ),

                    redirect:
                        "follow",

                    signal:
                        controller.signal

                }

            );


        if (
            !response.ok
        ) {

            throw new Error(

                "HTTP " +
                response.status

            );

        }


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(
                    text
                );

        }

        catch (error) {

            console.error(
                "後端原始回應：",
                text
            );


            throw new Error(
                "後端回傳格式錯誤"
            );

        }


        return data;

    }


    finally {

        clearTimeout(
            timeout
        );

    }

}


/* ============================================================
   從後端同步綁定狀態
   ============================================================ */

async function syncBindingFromBackend(
    silent = false
) {

    const chip =

        document.getElementById(
            "identityChip"
        );


    try {


        const result =

            await callBackend(
                "checkBinding"
            );


        if (
            !result.success
        ) {

            throw new Error(

                result.message ||
                "查詢綁定失敗"

            );

        }


        APP_STATE.backendReady =
            true;


        APP_STATE.bindingChecked =
            true;


        if (
            result.bound &&
            result.binding
        ) {

            APP_STATE.currentBinding = {

                club:
                    result.binding.club,

                category:
                    result.binding.category,

                createdAt:
                    result.binding.createdAt

            };

        }

        else {

            APP_STATE.currentBinding =
                null;

        }


        chip.textContent =

            "LINE：" +
            APP_STATE.displayName;


        return true;

    }


    catch (error) {


        console.error(
            "後端同步失敗：",
            error
        );


        APP_STATE.backendReady =
            false;


        APP_STATE.bindingChecked =
            false;


        chip.textContent =

            "LINE：" +
            (
                APP_STATE.displayName ||
                "使用者"
            ) +
            " · 同步失敗";


        if (!silent) {

            appendMessage(

                `

                ⚠️
                <b>
                    無法連線至綁定系統
                </b>

                <br><br>

                目前一般活動資訊仍可正常查詢，

                但社團綁定與專屬功能暫時無法使用。

                <div class="action-row">

                    <button

                    >

                        重新連線

                    </button>

                </div>

                `,

                "bot",

                true

            );

        }


        return false;

    }

}

/* ============================================================
   HTML 安全
   ============================================================ */

function escapeHtml(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

function appendMessage(

    useHTML = false
) {

    const container =

        document.getElementById(

        );


    const message =

        document.createElement(
            "div"
        );


    message.className =

        "message " +
        sender;


    if (useHTML) {

        message.innerHTML =
            content;

    }

    else {

        message.textContent =
            content;

    }


    container.appendChild(
        message
    );


    setTimeout(

        () => {

            container.scrollTo({

                top:
                    container.scrollHeight,

                behavior:
                    "smooth"

            });

        },

        30

    );

}

function findExactClub(
    inputName
) {

    const searchName =

        inputName.trim();


    for (

        const [
            category,
            clubs
        ]

        of Object.entries(
            CLUB_DATA
        )

    ) {


        const club =

            clubs.find(

                item =>

                    item.trim()
                    ===
                    searchName

            );


        if (club) {

            return {

                name:
                    club,

                category:
                    category

            };

        }

    }


    return null;

}

/* ============================================================

   ============================================================ */

function lookupBindingClub(
    panelId
) {

    const input =

        document.getElementById(
            panelId
        );


    const feedback =

        document.getElementById(
            panelId +
            "_feedback"
        );


    if (
        !input ||
        !feedback
    ) {

        return;

    }


    const value =

        input.value.trim();


    if (!value) {

        feedback.className =

            "binding-feedback error-text";


        feedback.textContent =

            "請先輸入社團完整名稱。";


        return;

    }


    if (
        APP_STATE.currentBinding
    ) {

        feedback.className =

            "binding-feedback error-text";


        feedback.textContent =

            "此帳號已完成社團綁定。";


        return;

    }


    const result =

        findExactClub(
            value
        );


    if (!result) {

        APP_STATE.pendingBinding =
            null;


        feedback.className =

            "binding-feedback error-text";


        feedback.innerHTML =

            "❌ 查無此社團。<br>" +

            "請確認是否輸入完整正式名稱。";


        return;

    }


    feedback.className =

        "binding-feedback success-text";


    feedback.innerHTML =

        "✅ 已找到社團。";


    APP_STATE.pendingBinding =

        result;


    showBindingConfirmation(
        result
    );

}

async function confirmClubBinding() {

    if (
        APP_STATE.bindingRequestRunning
    ) {

        return;

    }


    const club =

        APP_STATE.pendingBinding;


    if (!club) {

        appendMessage(

            "綁定資料已失效，請重新輸入社團名稱。",

            "bot"

        );


        return;

    }


    const button =

        document.getElementById(
            "confirmBindingBtn"
        );


    try {


        APP_STATE.bindingRequestRunning =
            true;


        if (button) {

            button.disabled =
                true;


            button.textContent =
                "綁定中...";

        }


        /*
        送給後端的只有：

        1. LINE ID Token
        2. 使用者選擇的社團名稱

        不送 userId。
        */


        const result =

            await callBackend(

                "bindClub",

                {

                    clubName:
                        club.name

                }

            );


        /*
        後端判斷已經綁定
        */

        if (
            result.error ===
            "ALREADY_BOUND"
        ) {


            if (
                result.binding
            ) {

                APP_STATE.currentBinding = {

                    club:
                        result.binding.club,

                    category:
                        result.binding.category

                };

            }


            APP_STATE.pendingBinding =
                null;


            showLockedBinding(
                APP_STATE.currentBinding
            );


            return;

        }


        if (
            !result.success
        ) {

            throw new Error(

                result.message ||
                "綁定失敗"

            );

        }


        APP_STATE.currentBinding = {

            club:
                result.binding.club,

            category:
                result.binding.category,

            createdAt:
                result.binding.createdAt

        };


        APP_STATE.pendingBinding =
            null;


        appendMessage(

            `

            "bot",

        );

    }


    catch (error) {


        console.error(
            error
        );


        appendMessage(

            `

            ❌
            <b>
                社團綁定失敗

        ✅ 已完成 LINE 帳號與社團身分驗證。

        <br><br>

        下一階段接上雲端管理功能後，

        這裡將只取得

        <b>
            ${escapeHtml(binding.club)}
        </b>

        的專屬雲端連結。

        `,

        "bot",

        true

    );

}


/* ============================================================
   Instagram
   ============================================================ */

function openInstagram() {

    openExternalUrl(

        "https://www.instagram.com/hksp_2002/"

    );

}


/* ============================================================
   外部連結
   ============================================================ */

function openExternalUrl(
    url
) {

    try {

        if (
            typeof liff !==
            "undefined"

            &&

            liff.isInClient()
        ) {

            liff.openWindow({

                url:
                    url,

                external:
                    true

            });


            return;

        }

    }

    catch (error) {

        console.warn(
            error
        );

    }


    window.open(

        url,

        "_blank",

        "noopener,noreferrer"

    );

}


/* ============================================================
   快捷鍵
   ============================================================ */

function clickQuickTag(
    text
) {

    processMessage(
        text
    );

}


/* ============================================================
   送出文字
   ============================================================ */

function handleFormSubmit(
    event
) {

    event.preventDefault();


    const input =

        document.getElementById(
            "userInput"
        );


    const query =

        input.value.trim();


    if (!query) {

        return;

    }


    input.value =
        "";


    processMessage(
        query
    );

}


/* ============================================================
   核心客服
   ============================================================ */

function processMessage(
    rawQuery
) {

    const query =

        rawQuery.trim();


    if (!query) {

        return;

    }


    appendMessage(

        query,

        "user"

    );


    setTimeout(

        async () => {


            /* 社團總覽 */

            if (

                query ===
                "社團總覽"

                ||

                query ===
                "社團總攬"

                ||

                query ===
                "社團一覽"

                ||

                query ===
                "社團名單"

            ) {

                showClubOverview();

                return;

            }


            /* 綁定 */

            if (

                query ===
                "社團綁定"

                ||

                query ===
                "綁定社團"

            ) {

                await showBindingPanel();

                return;

            }


            /* 社團雲端 */

            if (

                query ===
                "社團專屬雲端"

                ||

                query ===
                "社團雲端"

                ||

                query ===
                "雲端"

            ) {

                await showCloudPanel();

                return;

            }


            /* 五大類 */

            if (
                CLUB_DATA[
                    query
                ]
            ) {

                showClubCategory(
                    query
                );

                return;

            }


            /* 完整社團名稱 */

            const exactClub =

                findExactClub(
                    query
                );


            if (
                exactClub
            ) {

                appendMessage(

                    `

                    🔎
                    <b>
                        ${escapeHtml(exactClub.name)}
                    </b>

                    <br><br>

                    社團屬性：

                    <b>
                        ${escapeHtml(exactClub.category)}
                    </b>

                    `,

                    "bot",

                    true

                );


                return;

            }


            /* FAQ */

            for (

                const item

                of FAQ_DATA

            ) {

                const matched =

                    item.keywords.some(

                        keyword =>

                            query.includes(
                                keyword
                            )

                    );


                if (
                    matched
                ) {

                    appendMessage(

                        item.answer,

                        "bot",

                        true

                    );


                    return;

                }

            }


            /* 找不到 */

            appendMessage(

                `

                抱歉，目前找不到符合的資料。

                <br><br>

                📌 若您正在查詢社團，

                請輸入

                <b>
                    「社團完整名稱」
                </b>。

                <br><br>

                也可以使用下方

                <b>
                    「📚 社團總覽」
                </b>

                查看完整名單，

                或聯絡學生議會協助確認。

                `,

                "bot",

                true

            );


        },

        220

    );

}


</script>
