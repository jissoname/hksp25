<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        viewport-fit=cover"
    >

    <title>社團評選｜管理員後台</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --background: #f4f6f9;
            --card: #ffffff;
            --border: #e4e7ec;
            --text: #202124;
            --muted: #667085;
            --danger: #d92d20;
            --danger-bg: #fff1f0;
            --success: #167542;
            --success-bg: #e7f6ec;
            --warning: #9a6700;
            --warning-bg: #fff4dd;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--background);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                Roboto,
                sans-serif;

            color: var(--text);
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           登入畫面
           ===================================================== */

        .login-screen {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            padding: 32px;

            background: white;

            border: 1px solid var(--border);
            border-radius: 20px;

            box-shadow:
                0 12px 40px
                rgba(16, 24, 40, 0.08);
        }

        .login-icon {
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 18px;

            border-radius: 16px;

            background: #e8f0fe;

            font-size: 28px;
        }

        .login-title {
            margin: 0 0 7px;

            font-size: 24px;
            font-weight: 800;
        }

        .login-description {
            margin-bottom: 24px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.7;
        }

        .form-label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;
        }

        .password-wrap {
            display: flex;
            gap: 8px;
        }

        .form-input {
            width: 100%;
            height: 46px;

            padding: 0 14px;

            border: 1px solid #d0d5dd;
            border-radius: 10px;

            outline: none;

            background: white;

            font-size: 15px;
        }

        .form-input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(26, 115, 232, 0.10);
        }

        .password-toggle {
            flex-shrink: 0;

            width: 46px;

            border: 1px solid #d0d5dd;
            border-radius: 10px;

            background: white;

            font-size: 17px;
        }

        .login-btn {
            width: 100%;
            height: 46px;

            margin-top: 16px;

            border: none;
            border-radius: 10px;

            background: var(--primary);

            color: white;

            font-size: 15px;
            font-weight: 750;
        }

        .login-btn:hover {
            background: var(--primary-dark);
        }

        .login-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .login-error {
            min-height: 20px;

            margin-top: 12px;

            color: var(--danger);

            font-size: 13px;
        }


        /* =====================================================
           後台主畫面
           ===================================================== */

        .admin-app {
            display: none;

            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;

            z-index: 50;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding:
                15px
                max(20px, calc((100vw - 1180px) / 2));

            background:
                rgba(255,255,255,0.96);

            border-bottom:
                1px solid var(--border);

            backdrop-filter:
                blur(10px);
        }

        .brand {
            min-width: 0;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
        }

        .brand-subtitle {
            margin-top: 2px;

            color: var(--muted);

            font-size: 12px;
        }

        .topbar-actions {
            display: flex;
            gap: 8px;
        }

        .top-btn {
            height: 38px;

            padding: 0 14px;

            border: 1px solid var(--border);
            border-radius: 9px;

            background: white;

            color: #344054;

            font-size: 13px;
            font-weight: 700;
        }

        .top-btn:hover {
            background: #f8fafc;
        }

        .logout-btn {
            color: var(--danger);

            border-color: #f5c7c4;
        }

        .main {
            width: min(1180px, calc(100% - 32px));

            margin: 0 auto;

            padding: 28px 0 50px;
        }


        /* =====================================================
           頁面標題
           ===================================================== */

        .page-heading {
            margin-bottom: 22px;
        }

        .page-title {
            margin: 0;

            font-size: 25px;
            font-weight: 850;
        }

        .page-description {
            margin-top: 6px;

            color: var(--muted);

            font-size: 14px;
        }


        /* =====================================================
           統計卡片
           ===================================================== */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 22px;
        }

        .stat-card {
            padding: 20px;

            background: white;

            border: 1px solid var(--border);
            border-radius: 14px;

            box-shadow:
                0 3px 12px
                rgba(16,24,40,0.035);
        }

        .stat-label {
            color: var(--muted);

            font-size: 13px;
            font-weight: 650;
        }

        .stat-number {
            margin-top: 9px;

            font-size: 28px;
            font-weight: 850;
        }

        .stat-text {
            margin-top: 10px;

            font-size: 15px;
            font-weight: 800;
        }

        .status-chip {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 999px;

            background: var(--success-bg);

            color: var(--success);

            font-size: 12px;
            font-weight: 750;
        }


        /* =====================================================
           主要內容卡
           ===================================================== */

        .panel {
            background: white;

            border: 1px solid var(--border);
            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 3px 12px
                rgba(16,24,40,0.035);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 18px 20px;

            border-bottom:
                1px solid var(--border);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 800;
        }

        .result-count {
            color: var(--muted);

            font-size: 13px;
        }


        /* =====================================================
           搜尋
           ===================================================== */

        .search-wrap {
            padding: 16px 20px;

            border-bottom:
                1px solid var(--border);

            background: #fcfcfd;
        }

        .search-box {
            position: relative;
        }

        .search-icon {
            position: absolute;

            top: 50%;
            left: 14px;

            transform:
                translateY(-50%);

            color: #98a2b3;
        }

        .search-input {
            width: 100%;

            height: 44px;

            padding:
                0
                14px
                0
                42px;

            border: 1px solid #d0d5dd;
            border-radius: 10px;

            outline: none;

            background: white;

            font-size: 14px;
        }

        .search-input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(26,115,232,0.08);
        }


        /* =====================================================
           電腦表格
           ===================================================== */

        .table-wrap {
            width: 100%;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 900px;
        }

        th,
        td {
            padding: 14px 16px;

            border-bottom:
                1px solid #eaecf0;

            text-align: left;

            vertical-align: middle;
        }

        th {
            background: #f9fafb;

            color: #667085;

            font-size: 12px;
            font-weight: 750;

            white-space: nowrap;
        }

        td {
            font-size: 13px;
        }

        tbody tr:hover {
            background: #fafcff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .line-name {
            font-weight: 750;
        }

        .user-id {
            max-width: 220px;

            color: var(--muted);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Consolas,
                monospace;

            font-size: 11px;

            word-break: break-all;
        }

        .club-name {
            font-weight: 700;
        }

        .category-chip {
            display: inline-block;

            padding: 5px 9px;

            border-radius: 999px;

            background: #f2f4f7;

            color: #475467;

            font-size: 11px;
            font-weight: 700;
        }

        .date-text {
            color: var(--muted);

            white-space: nowrap;
        }

        .unbind-btn {
            padding:
                7px 11px;

            border: 1px solid #f5c7c4;
            border-radius: 8px;

            background: var(--danger-bg);

            color: var(--danger);

            font-size: 12px;
            font-weight: 750;
        }

        .unbind-btn:hover {
            background: #ffe4e1;
        }


        /* =====================================================
           手機版卡片
           ===================================================== */

        .mobile-list {
            display: none;
        }

        .binding-card {
            padding: 17px;

            border-bottom:
                1px solid var(--border);
        }

        .binding-card:last-child {
            border-bottom: none;
        }

        .binding-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 10px;
        }

        .binding-mobile-name {
            font-size: 15px;
            font-weight: 800;
        }

        .binding-mobile-club {
            margin-top: 4px;

            color: var(--primary);

            font-size: 14px;
            font-weight: 750;
        }

        .binding-mobile-info {
            margin-top: 13px;

            display: grid;
            gap: 7px;

            font-size: 12px;
            color: var(--muted);
        }

        .binding-mobile-id {
            word-break: break-all;
        }


        /* =====================================================
           空資料 / Loading
           ===================================================== */

        .state-box {
            padding: 50px 20px;

            text-align: center;

            color: var(--muted);
        }

        .state-icon {
            margin-bottom: 10px;

            font-size: 30px;
        }

        .spinner {
            width: 30px;
            height: 30px;

            margin: 0 auto 12px;

            border: 3px solid #e8eef7;
            border-top-color: var(--primary);
            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           Modal
           ===================================================== */

        .modal-backdrop {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(16,24,40,0.55);
        }

        .modal {
            width: 100%;
            max-width: 450px;

            background: white;

            border-radius: 17px;

            overflow: hidden;

            box-shadow:
                0 24px 60px
                rgba(16,24,40,0.22);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-icon {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 45px;
            height: 45px;

            margin-bottom: 15px;

            border-radius: 50%;

            background: var(--danger-bg);

            font-size: 22px;
        }

        .modal-title {
            margin: 0;

            font-size: 18px;
            font-weight: 850;
        }

        .modal-description {
            margin-top: 8px;

            color: var(--muted);

            font-size: 13px;
            line-height: 1.7;
        }

        .modal-info {
            margin-top: 16px;

            padding: 13px;

            border-radius: 10px;

            background: #f9fafb;

            font-size: 13px;

            line-height: 1.8;
        }

        .modal-footer {
            display: flex;

            justify-content: flex-end;

            gap: 9px;

            padding: 16px 24px;

            border-top:
                1px solid var(--border);

            background: #fcfcfd;
        }

        .modal-btn {
            height: 39px;

            padding:
                0 16px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 750;
        }

        .cancel-btn {
            border:
                1px solid #d0d5dd;

            background: white;

            color: #344054;
        }

        .confirm-danger-btn {
            border: none;

            background: var(--danger);

            color: white;
        }

        .confirm-danger-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }


        /* =====================================================
           Toast
           ===================================================== */

        .toast {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 2000;

            max-width: min(380px, calc(100% - 40px));

            padding:
                12px 16px;

            border-radius: 10px;

            background: #101828;

            color: white;

            font-size: 13px;

            box-shadow:
                0 10px 35px
                rgba(16,24,40,0.2);

            opacity: 0;

            transform:
                translateY(12px);

            pointer-events: none;

            transition:
                .25s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateY(0);
        }


        /* =====================================================
           Responsive
           ===================================================== */

        @media
        (max-width: 760px) {

            .topbar {
                padding:
                    13px 15px;
            }

            .brand-subtitle {
                display: none;
            }

            .top-btn span {
                display: none;
            }

            .main {
                width:
                    calc(100% - 22px);

                padding:
                    18px 0 35px;
            }

            .page-title {
                font-size: 21px;
            }

            .stats-grid {
                grid-template-columns:
                    1fr;
            }

            .desktop-table {
                display: none;
            }

            .mobile-list {
                display: block;
            }

            .panel-header {
                padding:
                    16px;
            }

            .search-wrap {
                padding:
                    13px 16px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     管理員登入
     ========================================================= -->

<section
    id="loginScreen"
    class="login-screen"
>

    <div class="login-card">

        <div class="login-icon">
            🛠️
        </div>

        <h1 class="login-title">
            管理員後台
        </h1>

        <div class="login-description">

            社團評選暨觀摩活動管理系統

            <br>

            請輸入管理員密碼後繼續。

        </div>


        <form
            onsubmit="handleAdminLogin(event)"
        >

            <label
                for="adminPassword"
                class="form-label"
            >
                管理員密碼
            </label>


            <div class="password-wrap">

                <input

                    id="adminPassword"

                    class="form-input"

                    type="password"

                    placeholder="請輸入管理員密碼"

                    autocomplete="current-password"

                    required

                >


                <button

                    type="button"

                    class="password-toggle"

                    onclick="togglePassword()"

                    title="顯示／隱藏密碼"

                >
                    👁️
                </button>

            </div>


            <button
                id="loginBtn"
                type="submit"
                class="login-btn"
            >
                登入管理後台
            </button>


            <div
                id="loginError"
                class="login-error"
            ></div>

        </form>

    </div>

</section>



<!-- =========================================================
     管理員主畫面
     ========================================================= -->

<div
    id="adminApp"
    class="admin-app"
>


    <header class="topbar">

        <div class="brand">

            <div class="brand-title">
                🛠️ 社團評選管理後台
            </div>

            <div class="brand-subtitle">
                115學年度第一學期全校學生社團評選暨觀摩活動
            </div>

        </div>


        <div class="topbar-actions">

            <button
                type="button"
                class="top-btn"
                onclick="loadBindings(true)"
            >
                🔄
                <span>重新整理</span>
            </button>


            <button
                type="button"
                class="top-btn logout-btn"
                onclick="logoutAdmin()"
            >
                🚪
                <span>登出</span>
            </button>

        </div>

    </header>



    <main class="main">


        <div class="page-heading">

            <h1 class="page-title">
                社團綁定管理
            </h1>

            <div class="page-description">
                查看目前 LINE 帳號與社團綁定狀態，並處理錯誤綁定。
            </div>

        </div>



        <!-- 統計 -->

        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-label">
                    已綁定帳號
                </div>

                <div
                    id="bindingCount"
                    class="stat-number"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    搜尋結果
                </div>

                <div
                    id="searchCount"
                    class="stat-number"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    綁定模式
                </div>

                <div class="stat-text">

                    <span class="status-chip">
                        🔒 單次綁定
                    </span>

                </div>

            </div>

        </section>



        <!-- 綁定列表 -->

        <section class="panel">


            <div class="panel-header">

                <div class="panel-title">
                    👥 LINE 帳號綁定資料
                </div>

                <div
                    id="resultCountText"
                    class="result-count"
                >
                    載入中...
                </div>

            </div>



            <div class="search-wrap">

                <div class="search-box">

                    <span class="search-icon">
                        🔎
                    </span>


                    <input

                        id="searchInput"

                        class="search-input"

                        type="search"

                        placeholder="搜尋 LINE 名稱、社團名稱、社團屬性或 User ID"

                        autocomplete="off"

                        oninput="filterBindings()"

                    >

                </div>

            </div>



            <div
                id="listState"
                class="state-box"
            >

                <div class="spinner"></div>

                正在讀取後端資料...

            </div>



            <!-- 電腦版 -->

            <div
                id="desktopTable"
                class="table-wrap desktop-table"
                style="display:none;"
            >

                <table>

                    <thead>

                    <tr>

                        <th>
                            LINE 名稱
                        </th>

                        <th>
                            LINE User ID
                        </th>

                        <th>
                            社團
                        </th>

                        <th>
                            屬性
                        </th>

                        <th>
                            綁定時間
                        </th>

                        <th>
                            操作
                        </th>

                    </tr>

                    </thead>


                    <tbody
                        id="bindingTableBody"
                    ></tbody>

                </table>

            </div>



            <!-- 手機版 -->

            <div
                id="mobileList"
                class="mobile-list"
            ></div>


        </section>


    </main>

</div>



<!-- =========================================================
     解除綁定確認視窗
     ========================================================= -->

<div
    id="unbindModal"
    class="modal-backdrop"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
    >

        <div class="modal-body">

            <div class="modal-icon">
                ⚠️
            </div>

            <h2 class="modal-title">
                確定解除綁定？
            </h2>

            <div class="modal-description">

                解除後，此 LINE 帳號下次進入系統時，
                將可以重新選擇社團進行綁定。

            </div>


            <div
                id="unbindInfo"
                class="modal-info"
            ></div>

        </div>


        <div class="modal-footer">

            <button
                type="button"
                class="modal-btn cancel-btn"
                onclick="closeUnbindModal()"
            >
                取消
            </button>


            <button
                id="confirmUnbindBtn"
                type="button"
                class="modal-btn confirm-danger-btn"
                onclick="confirmUnbind()"
            >
                確認解除
            </button>

        </div>

    </div>

</div>



<div
    id="toast"
    class="toast"
></div>



<script>


/* ============================================================
   後端設定
   ============================================================ */

const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbygg-cv817Dk8338KdcjChkMwAPjf-_sAnghtgIPfNn9GGEHveHEpjYQ7YV0gxtZct-/exec";


const ADMIN_SESSION_STORAGE_KEY =
    "HKSP_ADMIN_SESSION";


/* ============================================================
   APP STATE
   ============================================================ */

const ADMIN_STATE = {

    sessionToken:
        null,

    bindings:
        [],

    filteredBindings:
        [],

    pendingUnbind:
        null,

    requestRunning:
        false

};


/* ============================================================
   頁面初始化
   ============================================================ */

document.addEventListener(

    "DOMContentLoaded",

    async function () {


        const savedToken =

            sessionStorage.getItem(
                ADMIN_SESSION_STORAGE_KEY
            );


        if (savedToken) {


            ADMIN_STATE.sessionToken =
                savedToken;


            showAdminApp();


            await loadBindings(
                false
            );


        }

        else {


            showLoginScreen();

        }


    }

);


/* ============================================================
   呼叫後端
   ============================================================ */

async function callAdminBackend(
    action,
    extraData = {}
) {


    const payload = {

        action:
            action,

        ...extraData

    };


    const controller =
        new AbortController();


    const timeout =
        setTimeout(

            () =>
                controller.abort(),

            15000

        );


    try {


        const response =

            await fetch(

                BACKEND_URL,

                {

                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            payload
                        ),

                    redirect:
                        "follow",

                    signal:
                        controller.signal

                }

            );


        if (!response.ok) {

            throw new Error(

                "HTTP " +
                response.status

            );

        }


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(
                    text
                );

        }

        catch (error) {


            console.error(
                "後端原始回應：",
                text
            );


            throw new Error(
                "後端回傳格式錯誤"
            );

        }


        return data;

    }


    catch (error) {


        if (
            error.name ===
            "AbortError"
        ) {

            throw new Error(
                "後端連線逾時"
            );

        }


        throw error;

    }


    finally {


        clearTimeout(
            timeout
        );

    }

}


/* ============================================================
   登入
   ============================================================ */

async function handleAdminLogin(
    event
) {


    event.preventDefault();


    if (
        ADMIN_STATE.requestRunning
    ) {

        return;

    }


    const passwordInput =

        document.getElementById(
            "adminPassword"
        );


    const loginBtn =

        document.getElementById(
            "loginBtn"
        );


    const loginError =

        document.getElementById(
            "loginError"
        );


    const password =

        passwordInput.value;


    if (!password) {

        loginError.textContent =
            "請輸入管理員密碼。";

        return;

    }


    try {


        ADMIN_STATE.requestRunning =
            true;


        loginError.textContent =
            "";


        loginBtn.disabled =
            true;


        loginBtn.textContent =
            "登入中...";


        const result =

            await callAdminBackend(

                "adminLogin",

                {

                    password:
                        password

                }

            );


        /*
         * 密碼輸入框立刻清空。
         * 不把密碼存到 localStorage / sessionStorage。
         */

        passwordInput.value =
            "";


        if (
            !result.success ||
            !result.sessionToken
        ) {

            loginError.textContent =

                result.message ||
                "登入失敗。";


            return;

        }


        ADMIN_STATE.sessionToken =

            result.sessionToken;


        sessionStorage.setItem(

            ADMIN_SESSION_STORAGE_KEY,

            result.sessionToken

        );


        showAdminApp();


        await loadBindings(
            false
        );


        showToast(
            "✅ 管理員登入成功"
        );


    }


    catch (error) {


        console.error(
            error
        );


        loginError.textContent =

            "無法連線至管理系統：" +
            error.message;


    }


    finally {


        ADMIN_STATE.requestRunning =
            false;


        loginBtn.disabled =
            false;


        loginBtn.textContent =
            "登入管理後台";

    }

}


/* ============================================================
   登出
   ============================================================ */

async function logoutAdmin() {


    const token =

        ADMIN_STATE.sessionToken;


    /*
     * 不管後端登出是否成功，
     * 本機 Token 都會清除。
     */

    try {


        if (token) {


            await callAdminBackend(

                "adminLogout",

                {

                    sessionToken:
                        token

                }

            );

        }


    }

    catch (error) {


        console.warn(
            "後端登出失敗：",
            error
        );

    }


    clearAdminSession();


    showLoginScreen();


    showToast(
        "已登出管理員後台"
    );

}


/* ============================================================
   清除 Session
   ============================================================ */

function clearAdminSession() {


    ADMIN_STATE.sessionToken =
        null;


    ADMIN_STATE.bindings =
        [];


    ADMIN_STATE.filteredBindings =
        [];


    ADMIN_STATE.pendingUnbind =
        null;


    sessionStorage.removeItem(
        ADMIN_SESSION_STORAGE_KEY
    );

}


/* ============================================================
   取得全部綁定資料
   ============================================================ */

async function loadBindings(
    showSuccessToast = false
) {


    if (
        !ADMIN_STATE.sessionToken
    ) {

        showLoginScreen();

        return;

    }


    showLoadingState();


    try {


        const result =

            await callAdminBackend(

                "adminListBindings",

                {

                    sessionToken:
                        ADMIN_STATE.sessionToken

                }

            );


        /*
         * Session 過期
         */

        if (
            result.error ===
            "ADMIN_UNAUTHORIZED"
        ) {


            clearAdminSession();


            showLoginScreen();


            document.getElementById(
                "loginError"
            ).textContent =
                "管理員登入已失效，請重新登入。";


            return;

        }


        if (!result.success) {

            throw new Error(

                result.message ||
                "無法取得綁定資料"

            );

        }


        ADMIN_STATE.bindings =

            Array.isArray(
                result.bindings
            )

            ? result.bindings

            : [];


        filterBindings();


        if (showSuccessToast) {

            showToast(
                "✅ 資料已重新整理"
            );

        }


    }


    catch (error) {


        console.error(
            error
        );


        showErrorState(
            error.message
        );

    }

}


/* ============================================================
   搜尋
   ============================================================ */

function filterBindings() {


    const searchInput =

        document.getElementById(
            "searchInput"
        );


    const query =

        (
            searchInput
                ? searchInput.value
                : ""
        )
        .trim()
        .toLowerCase();


    if (!query) {


        ADMIN_STATE.filteredBindings =

            [
                ...ADMIN_STATE.bindings
            ];


    }

    else {


        ADMIN_STATE.filteredBindings =

            ADMIN_STATE.bindings.filter(

                item => {


                    const searchable = [

                        item.displayName,

                        item.userId,

                        item.club,

                        item.category

                    ]
                    .join(" ")
                    .toLowerCase();


                    return searchable.includes(
                        query
                    );

                }

            );

    }


    renderBindings();

}


/* ============================================================
   Render
   ============================================================ */

function renderBindings() {


    const allCount =

        ADMIN_STATE.bindings.length;


    const filteredCount =

        ADMIN_STATE.filteredBindings.length;


    document.getElementById(
        "bindingCount"
    ).textContent =
        allCount;


    document.getElementById(
        "searchCount"
    ).textContent =
        filteredCount;


    document.getElementById(
        "resultCountText"
    ).textContent =

        `顯示 ${filteredCount} / ${allCount} 筆`;


    const listState =

        document.getElementById(
            "listState"
        );


    const desktopTable =

        document.getElementById(
            "desktopTable"
        );


    const mobileList =

        document.getElementById(
            "mobileList"
        );


    if (
        filteredCount === 0
    ) {


        desktopTable.style.display =
            "none";


        mobileList.innerHTML =
            "";


        listState.style.display =
            "block";


        listState.innerHTML =

            `

            <div class="state-icon">
                📭
            </div>

            目前沒有符合條件的綁定資料。

            `;


        return;

    }


    listState.style.display =
        "none";


    /*
     * 桌機版
     */

    const tableBody =

        document.getElementById(
            "bindingTableBody"
        );


    tableBody.innerHTML =

        ADMIN_STATE.filteredBindings

            .map(

                item => {


                    return `

                    <tr>

                        <td>

                            <div class="line-name">

                                ${escapeHtml(item.displayName || "LINE 使用者")}

                            </div>

                        </td>


                        <td>

                            <div
                                class="user-id"
                                title="${escapeAttribute(item.userId || "")}"
                            >

                                ${escapeHtml(item.userId || "")}

                            </div>

                        </td>


                        <td>

                            <div class="club-name">

                                ${escapeHtml(item.club || "-")}

                            </div>

                        </td>


                        <td>

                            <span class="category-chip">

                                ${escapeHtml(item.category || "-")}

                            </span>

                        </td>


                        <td>

                            <span class="date-text">

                                ${escapeHtml(formatDate(item.createdAt))}

                            </span>

                        </td>


                        <td>

                            <button

                                type="button"

                                class="unbind-btn"

                                onclick="openUnbindModal('${encodeURIComponent(item.userId || "")}')"

                            >

                                解除綁定

                            </button>

                        </td>

                    </tr>

                    `;

                }

            )
            .join("");


    desktopTable.style.display =
        "";


    /*
     * 手機版
     */

    mobileList.innerHTML =

        ADMIN_STATE.filteredBindings

            .map(

                item => {


                    return `

                    <div class="binding-card">

                        <div class="binding-card-top">

                            <div>

                                <div class="binding-mobile-name">

                                    ${escapeHtml(item.displayName || "LINE 使用者")}

                                </div>

                                <div class="binding-mobile-club">

                                    ${escapeHtml(item.club || "-")}

                                </div>

                            </div>


                            <button

                                type="button"

                                class="unbind-btn"

                                onclick="openUnbindModal('${encodeURIComponent(item.userId || "")}')"

                            >

                                解除綁定

                            </button>

                        </div>


                        <div class="binding-mobile-info">

                            <div>

                                屬性：
                                ${escapeHtml(item.category || "-")}

                            </div>


                            <div>

                                綁定時間：
                                ${escapeHtml(formatDate(item.createdAt))}

                            </div>


                            <div class="binding-mobile-id">

                                User ID：
                                ${escapeHtml(item.userId || "")}

                            </div>

                        </div>

                    </div>

                    `;

                }

            )
            .join("");

}


/* ============================================================
   Loading
   ============================================================ */

function showLoadingState() {


    const listState =

        document.getElementById(
            "listState"
        );


    document.getElementById(
        "desktopTable"
    ).style.display =
        "none";


    document.getElementById(
        "mobileList"
    ).innerHTML =
        "";


    listState.style.display =
        "block";


    listState.innerHTML =

        `

        <div class="spinner"></div>

        正在讀取後端資料...

        `;

}


/* ============================================================
   Error
   ============================================================ */

function showErrorState(
    message
) {


    const listState =

        document.getElementById(
            "listState"
        );


    document.getElementById(
        "desktopTable"
    ).style.display =
        "none";


    document.getElementById(
        "mobileList"
    ).innerHTML =
        "";


    listState.style.display =
        "block";


    listState.innerHTML =

        `

        <div class="state-icon">
            ⚠️
        </div>

        ${escapeHtml(message || "資料讀取失敗")}

        <br><br>

        <button

            type="button"

            class="top-btn"

            onclick="loadBindings(true)"

        >

            重新嘗試

        </button>

        `;

}


/* ============================================================
   解除綁定 Modal
   ============================================================ */

function openUnbindModal(
    encodedUserId
) {


    const userId =

        decodeURIComponent(
            encodedUserId
        );


    const item =

        ADMIN_STATE.bindings.find(

            binding =>

                binding.userId ===
                userId

        );


    if (!item) {

        showToast(
            "找不到這筆綁定資料"
        );

        return;

    }


    ADMIN_STATE.pendingUnbind =
        item;


    document.getElementById(
        "unbindInfo"
    ).innerHTML =

        `

        <b>LINE 名稱：</b>
        ${escapeHtml(item.displayName || "LINE 使用者")}

        <br>

        <b>社團：</b>
        ${escapeHtml(item.club || "-")}

        <br>

        <b>社團屬性：</b>
        ${escapeHtml(item.category || "-")}

        `;


    document.getElementById(
        "unbindModal"
    ).style.display =
        "flex";

}


/* ============================================================
   關閉 Modal
   ============================================================ */

function closeUnbindModal() {


    if (
        ADMIN_STATE.requestRunning
    ) {

        return;

    }


    ADMIN_STATE.pendingUnbind =
        null;


    document.getElementById(
        "unbindModal"
    ).style.display =
        "none";

}


/* ============================================================
   確認解除綁定
   ============================================================ */

async function confirmUnbind() {


    if (
        ADMIN_STATE.requestRunning
    ) {

        return;

    }


    const item =

        ADMIN_STATE.pendingUnbind;


    if (!item) {

        return;

    }


    const button =

        document.getElementById(
            "confirmUnbindBtn"
        );


    try {


        ADMIN_STATE.requestRunning =
            true;


        button.disabled =
            true;


        button.textContent =
            "解除中...";


        const result =

            await callAdminBackend(

                "adminUnbind",

                {

                    sessionToken:
                        ADMIN_STATE.sessionToken,

                    userId:
                        item.userId

                }

            );


        if (
            result.error ===
            "ADMIN_UNAUTHORIZED"
        ) {


            closeUnbindModal();


            clearAdminSession();


            showLoginScreen();


            document.getElementById(
                "loginError"
            ).textContent =
                "管理員登入已失效，請重新登入。";


            return;

        }


        if (!result.success) {

            throw new Error(

                result.message ||
                "解除綁定失敗"

            );

        }


        /*
         * 從前端暫存名單移除
         */

        ADMIN_STATE.bindings =

            ADMIN_STATE.bindings.filter(

                binding =>

                    binding.userId !==
                    item.userId

            );


        ADMIN_STATE.pendingUnbind =
            null;


        document.getElementById(
            "unbindModal"
        ).style.display =
            "none";


        filterBindings();


        showToast(

            `✅ 已解除 ${item.displayName || "該使用者"} 的社團綁定`

        );


    }


    catch (error) {


        console.error(
            error
        );


        showToast(

            "❌ " +
            error.message

        );


    }


    finally {


        ADMIN_STATE.requestRunning =
            false;


        button.disabled =
            false;


        button.textContent =
            "確認解除";

    }

}


/* ============================================================
   Login / App 切換
   ============================================================ */

function showLoginScreen() {


    document.getElementById(
        "loginScreen"
    ).style.display =
        "flex";


    document.getElementById(
        "adminApp"
    ).style.display =
        "none";


    setTimeout(

        () => {

            const input =

                document.getElementById(
                    "adminPassword"
                );


            if (input) {

                input.focus();

            }

        },

        50

    );

}


function showAdminApp() {


    document.getElementById(
        "loginScreen"
    ).style.display =
        "none";


    document.getElementById(
        "adminApp"
    ).style.display =
        "block";

}


/* ============================================================
   顯示密碼
   ============================================================ */

function togglePassword() {


    const input =

        document.getElementById(
            "adminPassword"
        );


    input.type =

        input.type ===
        "password"

        ? "text"

        : "password";

}


/* ============================================================
   日期
   ============================================================ */

function formatDate(
    isoString
) {


    if (!isoString) {

        return "-";

    }


    const date =

        new Date(
            isoString
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return isoString;

    }


    return new Intl.DateTimeFormat(

        "zh-TW",

        {

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }

    ).format(
        date
    );

}


/* ============================================================
   Escape
   ============================================================ */

function escapeHtml(
    text
) {


    return String(
        text ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeAttribute(
    text
) {


    return escapeHtml(
        text
    );

}


/* ============================================================
   Toast
   ============================================================ */

let toastTimer =
    null;


function showToast(
    message
) {


    const toast =

        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    if (toastTimer) {

        clearTimeout(
            toastTimer
        );

    }


    toastTimer =

        setTimeout(

            () => {

                toast.classList.remove(
                    "show"
                );

            },

            3000

        );

}


/* ============================================================
   點背景關閉 Modal
   ============================================================ */

document.getElementById(
    "unbindModal"
).addEventListener(

    "click",

    function (event) {


        if (
            event.target ===
            this
        ) {

            closeUnbindModal();

        }

    }

);


/* ============================================================
   ESC 關閉 Modal
   ============================================================ */

document.addEventListener(

    "keydown",

    function (event) {


        if (
            event.key ===
            "Escape"
        ) {

            closeUnbindModal();

        }

    }

);


</script>
