<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>社團評鑑｜評審（PocketBase）</title>
  <link rel="icon" href="./bg-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="./bg-logo.png">
  <style>
    :root {
      --bg: #f3f0ea;
      --ink: #1c2430;
      --muted: #5b6573;
      --line: #d7d0c4;
      --panel: #fffdf8;
      --accent: #0f5c4c;
      --accent-ink: #f7fff9;
      --warn: #8a3b12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 12% -10%, #d9ebe4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #efe2cf 0%, transparent 50%),
        var(--bg);
      min-height: 100vh;
    }
    main {
      width: min(920px, calc(100% - 2rem));
      margin: 2rem auto 3rem;
    }
    h1 { margin: 0 0 .35rem; font-size: 1.55rem; letter-spacing: .02em; }
    .sub { color: var(--muted); margin: 0 0 1.25rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-size: .9rem; margin-bottom: .35rem; color: var(--muted); }
    input, select, textarea, button {
      font: inherit;
    }
    input, select, textarea {
      width: 100%;
      padding: .65rem .75rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      margin-bottom: .85rem;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: .65rem 1.1rem;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .msg { min-height: 1.25rem; color: var(--warn); margin: .4rem 0 0; white-space: pre-wrap; }
    .ok { color: var(--accent); }
    .file {
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      padding: .7rem 0;
      border-bottom: 1px solid var(--line);
      font-size: .95rem;
    }
    .file:last-child { border-bottom: 0; }
    .file a { color: var(--accent); }
    .meta { color: var(--muted); font-size: .82rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>社團評鑑評審台</h1>
    <p class="sub">PocketBase 主路徑 · 檢視社團繳交並送出分數</p>

    <section id="loginPanel" class="panel">
      <label for="email">評審帳號（Email）</label>
      <input id="email" type="email" autocomplete="username" value="hksp_6188@hk.edu.tw" />
      <label for="password">密碼</label>
      <input id="password" type="password" autocomplete="current-password" value="JudgeDemo123!" />
      <div class="row">
        <button id="loginBtn" type="button">登入</button>
      </div>
      <p id="loginMsg" class="msg"></p>
    </section>

    <section id="appPanel" class="panel hidden">
      <div class="row" style="justify-content:space-between;margin-bottom:.8rem">
        <div>
          <strong id="judgeName">—</strong>
          <div class="meta" id="judgeMeta"></div>
        </div>
        <button id="logoutBtn" class="secondary" type="button">登出</button>
      </div>

      <label for="clubSelect">社團</label>
      <select id="clubSelect"></select>

      <div class="row" style="margin-bottom:1rem">
        <button id="refreshBtn" class="secondary" type="button">重新載入繳交</button>
      </div>

      <h2 style="font-size:1.05rem;margin:0 0 .5rem">繳交檔案</h2>
      <div id="fileList" class="meta">尚未載入</div>

      <h2 style="font-size:1.05rem;margin:1.2rem 0 .5rem">分數</h2>
      <label for="score">總分</label>
      <input id="score" type="number" step="0.1" min="0" max="100" />
      <label for="comment">評語</label>
      <textarea id="comment" rows="4" placeholder="可選"></textarea>
      <div class="row">
        <button id="draftBtn" class="secondary" type="button">存草稿</button>
        <button id="submitBtn" type="button">送出分數</button>
      </div>
      <p id="scoreMsg" class="msg"></p>
    </section>
  </main>

  <script src="./pb-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.25.2/dist/pocketbase.umd.js"></script>
  <script src="./platform-pb-backend.js"></script>
  <script>
    (function () {
      var api = window.HKSP_PB_BACKEND;
      if (!api) {
        document.getElementById("loginMsg").textContent = "PocketBase 後端未載入。";
        return;
      }

      var state = { clubId: "", clubs: [] };

      function $(id) { return document.getElementById(id); }
      function setMsg(el, text, ok) {
        el.textContent = text || "";
        el.className = "msg" + (ok ? " ok" : "");
      }
      function bytes(n) {
        n = Number(n) || 0;
        if (n < 1024) return n + " B";
        if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
        return (n / 1048576).toFixed(1) + " MB";
      }

      function showApp(profile) {
        $("loginPanel").classList.add("hidden");
        $("appPanel").classList.remove("hidden");
        $("judgeName").textContent = profile.name || profile.email || "評審";
        $("judgeMeta").textContent = (profile.role || "") + " · " + (profile.email || "");
      }

      function showLogin() {
        $("appPanel").classList.add("hidden");
        $("loginPanel").classList.remove("hidden");
      }

      function loadClubs() {
        return api.call("judgeListClubs").then(function (res) {
          var clubs = (res.data && res.data.clubs) || [];
          state.clubs = clubs;
          var sel = $("clubSelect");
          sel.innerHTML = "";
          if (!clubs.length) {
            sel.innerHTML = '<option value="">（尚無社團）</option>';
            return;
          }
          clubs.forEach(function (c, i) {
            var opt = document.createElement("option");
            opt.value = c.id;
            opt.textContent = (c.clubName || c.permanentClubId) +
              (c.category ? " · " + c.category : "");
            if (i === 0) opt.selected = true;
            sel.appendChild(opt);
          });
          state.clubId = clubs[0].id;
          return loadClubDetail();
        });
      }

      function renderFiles(files) {
        var box = $("fileList");
        if (!files || !files.length) {
          box.textContent = "此社團尚無已完成上傳。";
          return;
        }
        box.innerHTML = "";
        files.forEach(function (f) {
          var row = document.createElement("div");
          row.className = "file";
          var left = document.createElement("div");
          var title = document.createElement("div");
          var link = f.fileUrl || f.webViewLink;
          if (link) {
            var a = document.createElement("a");
            a.href = link;
            a.target = "_blank";
            a.rel = "noopener";
            a.textContent = f.name || f.fileName || "檔案";
            title.appendChild(a);
          } else {
            title.textContent = f.name || f.fileName || "檔案";
          }
          var meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = bytes(f.size) +
            (f.mimeType ? " · " + f.mimeType : "") +
            (f.uploadedAt ? " · " + String(f.uploadedAt).slice(0, 19).replace("T", " ") : "");
          left.appendChild(title);
          left.appendChild(meta);
          row.appendChild(left);
          box.appendChild(row);
        });
      }

      function loadScore() {
        return api.call("judgeGetScore", {
          clubId: state.clubId,
          sectionId: "default"
        }).then(function (res) {
          var s = res.data && res.data.score;
          if (!s) {
            $("score").value = "";
            $("comment").value = "";
            setMsg($("scoreMsg"), "尚無分數紀錄。", true);
            return;
          }
          $("score").value = s.score;
          $("comment").value = s.comment || "";
          setMsg(
            $("scoreMsg"),
            "已載入" + (s.status === "draft" ? "草稿" : "已送出") +
              "（rev " + (s.revision || 1) + "）",
            true
          );
        });
      }

      function loadClubDetail() {
        if (!state.clubId) return Promise.resolve();
        setMsg($("scoreMsg"), "載入中…");
        $("fileList").textContent = "載入中…";
        return api.call("judgeListClubFiles", { clubId: state.clubId }).then(function (res) {
          renderFiles((res.data && res.data.files) || []);
          return loadScore();
        }).catch(function (e) {
          $("fileList").textContent = "";
          setMsg($("scoreMsg"), (e && e.message) || "載入失敗");
        });
      }

      function saveScore(status) {
        var score = Number($("score").value);
        if (!Number.isFinite(score)) {
          setMsg($("scoreMsg"), "請輸入有效分數。");
          return Promise.resolve();
        }
        $("submitBtn").disabled = true;
        $("draftBtn").disabled = true;
        return api.call("judgeSubmitScore", {
          clubId: state.clubId,
          sectionId: "default",
          score: score,
          comment: $("comment").value || "",
          status: status
        }).then(function (res) {
          var d = res.data || {};
          setMsg(
            $("scoreMsg"),
            (status === "draft" ? "草稿已存" : "分數已送出") +
              "（rev " + (d.revision || 1) + "）",
            true
          );
        }).catch(function (e) {
          setMsg($("scoreMsg"), (e && e.message) || "儲存失敗");
        }).then(function () {
          $("submitBtn").disabled = false;
          $("draftBtn").disabled = false;
        });
      }

      $("loginBtn").addEventListener("click", function () {
        setMsg($("loginMsg"), "登入中…");
        api.call("judgeLogin", {
          email: $("email").value,
          password: $("password").value
        }).then(function (res) {
          setMsg($("loginMsg"), "", true);
          showApp(res.data || {});
          return loadClubs();
        }).catch(function (e) {
          setMsg($("loginMsg"), (e && e.message) || "登入失敗");
        });
      });

      $("logoutBtn").addEventListener("click", function () {
        api.call("judgeLogout").then(function () {
          showLogin();
          setMsg($("loginMsg"), "已登出。", true);
        });
      });

      $("clubSelect").addEventListener("change", function () {
        state.clubId = $("clubSelect").value;
        loadClubDetail();
      });
      $("refreshBtn").addEventListener("click", loadClubDetail);
      $("draftBtn").addEventListener("click", function () { saveScore("draft"); });
      $("submitBtn").addEventListener("click", function () { saveScore("submitted"); });

      // Resume session if staff token still valid
      try {
        var rec = api.pb && api.pb.authStore && api.pb.authStore.model;
        if (api.pb.authStore.isValid && rec && (rec.role === "judge" || rec.role === "admin")) {
          showApp({ name: rec.name, email: rec.email, role: rec.role });
          loadClubs();
        }
      } catch (_e) { /* ignore */ }
    })();
  </script>
</body>
</html>
